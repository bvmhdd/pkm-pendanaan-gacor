91\":692,\"_693\":694,\"_695\":696,\"_697\":698,\"_699\":700,\"_701\":702,\"_703\":696,\"_704\":705,\"_706\":700,\"_707\":708,\"_709\":696,\"_710\":698,\"_711\":712,\"_713\":714,\"_715\":716,\"_717\":716,\"_718\":700,\"_719\":720,\"_721\":696,\"_722\":716,\"_723\":700,\"_724\":725,\"_726\":716,\"_727\":716,\"_728\":700,\"_729\":730,\"_731\":696,\"_732\":716,\"_733\":700,\"_734\":735,\"_736\":737,\"_738\":698,\"_739\":700,\"_740\":741,\"_742\":743,\"_744\":745,\"_746\":747,\"_748\":749,\"_750\":751,\"_752\":753,\"_754\":755,\"_756\":757,\"_758\":759,\"_760\":761,\"_762\":763,\"_764\":725,\"_765\":766,\"_767\":768,\"_769\":770,\"_771\":772,\"_773\":774,\"_775\":776,\"_777\":778,\"_779\":780,\"_781\":782,\"_783\":784,\"_785\":786,\"_787\":788,\"_789\":790,\"_791\":792,\"_793\":794,\"_795\":796,\"_797\":798,\"_799\":800,\"_801\":802,\"_803\":804,\"_805\":806},\"fallbackMarkdown\",\"Menurut saya, untuk PKM-KC justru lebih baik memilih inovasi yang **sederhana, murah, mudah dibuat, tetapi menyelesaikan masalah kesehatan yang nyata**\\\\. Tidak harus menggunakan AI yang kompleks atau banyak sensor. Yang penting ada kebaruan, fungsi alat jelas, dan manfaatnya bisa dibuktikan.\\n\\nSaya coba arahkan ke ide yang realistis dikerjakan mahasiswa Sistem Telekomunikasi dengan komponen yang relatif terjangkau.\\n\\n# 8 ide PKM-KC sederhana tetapi berdampak\\n\\n## 1\\\\. FALL-SAFE: Alat Deteksi Jatuh untuk Lansia\\n\\n(Sangat direkomendasikan)\\n\\nimage_group{\\\"query\\\":[\\\"wearable fall detection pendant ESP32 accelerometer prototype\\\"],\\\"aspect_ratio\\\":\\\"16:9\\\",\\\"layout\\\":\\\"carousel\\\",\\\"num_per_query\\\":1}\\n\\n**Judul\\\\:** FALL-SAFE: Wearable Fall Detection Berbasis Accelerometer dan Komunikasi Bluetooth untuk Sistem Peringatan Darurat pada Lansia.\\n\\n- Masalah: Lansia yang jatuh terkadang tidak mampu meminta pertolongan.\\n- Inovasi: Alat kecil yang dikenakan di tubuh untuk mendeteksi gerakan jatuh.\\n- Teknologi: ESP32, accelerometer MPU6050, Bluetooth, buzzer.\\n- Kebaruan: Deteksi jatuh dengan mempertimbangkan pola gerakan sebelum dan sesudah benturan untuk mengurangi alarm palsu.\\n- Metode: Merancang alat, mengembangkan algoritma ambang gerak, menguji berbagai simulasi gerakan jatuh dan aktivitas normal.\\n- Luaran: Wearable pendeteksi jatuh dan aplikasi notifikasi keluarga.\\n\\n## 2\\\\. MEDI-REMINDER: Pengingat Obat untuk Pasien Lansia\\nimage_group{\\\"query\\\":[\\\"smart pill box medicine reminder ESP32 electronic prototype\\\"],\\\"aspect_ratio\\\":\\\"16:9\\\",\\\"layout\\\":\\\"carousel\\\",\\\"num_per_query\\\":1}\\n\\n**Judul\\\\:** MEDI-REMINDER: Kotak Obat Pintar Berbasis IoT dengan Notifikasi Nirkabel untuk Meningkatkan Kepatuhan Konsumsi Obat pada Lansia.\\n\\n- Masalah: Pasien lansia sering lupa jadwal minum obat.\\n- Inovasi: Kotak obat yang memberikan alarm sesuai jadwal dan notifikasi kepada keluarga jika obat belum diambil.\\n- Teknologi: ESP32, RTC, buzzer, LED, sensor buka-tutup, Wi-Fi.\\n- Kebaruan: Pencatatan waktu pembukaan kompartemen dan notifikasi ketika jadwal terlewat.\\n- Metode: Merancang kotak obat, mengintegrasikan sensor, membuat sistem jadwal, menguji ketepatan waktu dan notifikasi.\\n- Luaran: Prototype kotak obat pintar.\\n\\n## 3\\\\. POSTURE-BAND: Pengingat Postur Tubuh\\nimage_group{\\\"query\\\":[\\\"wearable posture correction sensor vibration device prototype\\\"],\\\"aspect_ratio\\\":\\\"16:9\\\",\\\"layout\\\":\\\"carousel\\\",\\\"num_per_query\\\":1}\\n\\n**Judul\\\\:** POSTURE-BAND: Wearable Sensor Berbasis IMU dengan Notifikasi Getaran untuk Pencegahan Kebiasaan Postur Tubuh yang Buruk.\\n\\n- Masalah: Kebiasaan duduk membungkuk dapat menyebabkan keluhan muskuloskeletal.\\n- Inovasi: Alat yang mendeteksi kemiringan tubuh dan memberikan getaran ketika posisi buruk berlangsung terlalu lama.\\n- Teknologi: ESP32, MPU6050, motor getar.\\n- Kebaruan: Deteksi postur berdasarkan durasi dan sudut kemiringan, bukan hanya perubahan posisi sesaat.\\n- Metode: Kalibrasi sensor, pengembangan algoritma sudut, pengujian berbagai posisi duduk.\\n- Luaran: Wearable pengingat postur.\\n\\n## 4\\\\. DEHYDRA-SENSE: Monitoring Risiko Dehidrasi\\nimage_group{\\\"query\\\":[\\\"wearable skin temperature humidity sensor health monitoring prototype wristband\\\"],\\\"aspect_ratio\\\":\\\"16:9\\\",\\\"layout\\\":\\\"carousel\\\",\\\"num_per_query\\\":1}\\n\\n**Judul\\\\:** DEHYDRA-SENSE: Wearable Monitoring Suhu Kulit dan Aktivitas Berbasis IoT sebagai Sistem Peringatan Risiko Dehidrasi.\\n\\n- Masalah: Dehidrasi sering tidak disadari, khususnya pada anak dan lansia.\\n- Inovasi: Perangkat yang memantau suhu kulit dan aktivitas sebagai informasi pendukung risiko dehidrasi.\\n- Teknologi: Sensor suhu, accelerometer, ESP32, Bluetooth.\\n- Kebaruan: Penggabungan data suhu kulit dan aktivitas untuk menghasilkan peringatan kontekstual.\\n- Metode: Integrasi sensor, pengolahan data, pengujian stabilitas dan respons sistem.\\n- Luaran: Wearable monitoring dan aplikasi pengingat minum.\\n\\nCatatan: suhu kulit dan aktivitas tidak cukup untuk memastikan dehidrasi. Alat ini harus diposisikan sebagai pengingat hidrasi, bukan alat diagnosis.\\n\\n## 5\\\\. BREATH-ALERT: Pengingat dan Monitoring Pola Pernapasan\\nimage_group{\\\"query\\\":[\\\"portable respiratory breathing rate sensor wearable chest band prototype\\\"],\\\"aspect_ratio\\\":\\\"16:9\\\",\\\"layout\\\":\\\"carousel\\\",\\\"num_per_query\\\":1}\\n\\n**Judul\\\\:** BREATH-ALERT: Portable Respiratory Rate Monitor Berbasis Sensor Stretch dan Wireless Communication untuk Pemantauan Frekuensi Pernapasan.\\n\\n- Masalah: Frekuensi pernapasan merupakan parameter penting dalam pemantauan kondisi kesehatan.\\n- Inovasi: Alat sederhana untuk mengukur frekuensi napas secara berkala.\\n- Teknologi: Stretch sensor, ESP32, Bluetooth.\\n- Kebaruan: Pengolahan sinyal untuk menghitung pola inspirasi dan ekspirasi serta mendeteksi perubahan frekuensi napas.\\n- Metode: Akuisisi sinyal, filtering, perhitungan frekuensi, pengujian terhadap penghitungan manual.\\n- Luaran: Prototype alat monitoring pernapasan.\\n\\n## 6\\\\. FOOT-GUARD: Peringatan Tekanan Berlebih pada Telapak Kaki\\nimage_group{\\\"query\\\":[\\\"pressure sensor smart footwear insole electronics prototype\\\"],\\\"aspect_ratio\\\":\\\"16:9\\\",\\\"layout\\\":\\\"carousel\\\",\\\"num_per_query\\\":1}\\n\\n**Judul\\\\:** FOOT-GUARD: Smart Insole Berbasis Pressure Sensor dan Wireless Alert untuk Monitoring Distribusi Tekanan Telapak Kaki pada Penderita Diabetes.\\n\\n- Masalah: Penderita diabetes berisiko mengalami luka kaki akibat gangguan sensitivitas dan tekanan berulang.\\n- Inovasi: Alas kaki yang memantau titik tekanan tinggi dan memberikan peringatan.\\n- Teknologi: FSR sensor, ESP32, buzzer, Bluetooth.\\n- Kebaruan: Peringatan berdasarkan durasi tekanan berlebih, bukan hanya besarnya tekanan.\\n- Metode: Integrasi sensor, kalibrasi tekanan, pengujian distribusi beban dan alarm.\\n- Luaran: Prototype smart insole.\\n\\n## 7\\\\. COUGH-COUNT: Penghitung Frekuensi Batuk Otomatis\\nimage_group{\\\"query\\\":[\\\"portable cough detection wearable microphone sensor ESP32 prototype\\\"],\\\"aspect_ratio\\\":\\\"16:9\\\",\\\"layout\\\":\\\"carousel\\\",\\\"num_per_query\\\":1}\\n\\n**Judul\\\\:** COUGH-COUNT: Portable Acoustic Cough Monitoring Berbasis Digital Signal Processing untuk Pemantauan Frekuensi Batuk Harian.\\n\\n- Masalah: Frekuensi batuk sering tidak tercatat secara objektif.\\n- Inovasi: Perangkat yang mendeteksi dan mencatat kejadian batuk.\\n- Teknologi: Mikrofon, ESP32, DSP, Bluetooth.\\n- Kebaruan: Deteksi batuk dengan pemisahan suara lingkungan dan pencatatan frekuensi harian.\\n- Metode: Perekaman suara, filtering, ekstraksi fitur akustik, klasifikasi sederhana dan pengujian.\\n- Luaran: Prototype penghitung batuk otomatis.\\n\\n## 8\\\\. SAFE-HEAT: Alarm Suhu Tubuh untuk Anak\\nimage_group{\\\"query\\\":[\\\"wearable child body temperature monitoring patch sensor electronic prototype\\\"],\\\"aspect_ratio\\\":\\\"16:9\\\",\\\"layout\\\":\\\"carousel\\\",\\\"num_per_query\\\":1}\\n\\n**Judul\\\\:** SAFE-HEAT: Wearable Temperature Monitoring Berbasis IoT dengan Sistem Peringatan Dini Perubahan Suhu Tubuh Anak.\\n\\n- Masalah: Orang tua kesulitan memantau perubahan suhu anak secara berkala, khususnya saat tidur.\\n- Inovasi: Sensor suhu yang mengirimkan notifikasi saat pembacaan mencapai ambang yang ditentukan.\\n- Teknologi: Sensor suhu kontak, ESP32, Bluetooth, buzzer.\\n- Kebaruan: Monitoring suhu kontinu dengan pencatatan tren dan notifikasi otomatis.\\n- Metode: Kalibrasi sensor terhadap termometer referensi, pengujian kestabilan dan notifikasi.\\n- Luaran: Prototype wearable temperature monitor.\\n\\nCatatan: sensor harus dikalibrasi dengan baik dan pembacaan suhu kulit tidak boleh dianggap sama dengan suhu inti tubuh.\\n\\n---\\n\\n# Perbandingan ide berdasarkan kelayakan PKM-KC\\n\\nPenilaian berikut merupakan estimasi awal berdasarkan kompleksitas pengembangan, biaya relatif, dan kemudahan demonstrasi.\\n\\n| Ide | Biaya relatif | Kesulitan | Dampak potensial |\\n|--------|--------|--------|--------|\\n| FALL-SAFE | Rendah | Mudah | Tinggi |\\n| MEDI-REMINDER | Rendah | Sangat mudah | Tinggi |\\n| POSTURE-BAND | Rendah | Mudah | Sedang–tinggi |\\n| DEHYDRA-SENSE | Sedang | Sedang | Tinggi |\\n| BREATH-ALERT | Rendah | Sedang | Tinggi |\\n| FOOT-GUARD | Sedang | Sedang | Tinggi |\\n| COUGH-COUNT | Rendah | Sedang | Tinggi |\\n| SAFE-HEAT | Rendah–sedang | Mudah | Tinggi |\\n\\n# Tiga ide yang paling saya sarankan\\n\\n(Paling mudah direalisasikan)\\n\\n**1\\\\. MEDI-REMINDER**\\n\\nAlasan: komponen mudah diperoleh, perakitan relatif sederhana, dan manfaatnya langsung dirasakan pasien lansia.\\n\\n---\\n\\n(Keseimbangan inovasi dan manfaat)\\n\\n**2\\\\. FOOT-GUARD**\\n\\nAlasan: memiliki hubungan kuat dengan bidang kesehatan, sensor, pengolahan data, dan telekomunikasi. Bentuk prototype juga menarik untuk demonstrasi.\\n\\n---\\n\\n(Potensi inovasi teknis)\\n\\n**3\\\\. COUGH-COUNT**\\n\\nAlasan: sangat sesuai dengan kompetensi pengolahan sinyal digital dan telekomunikasi, serta memiliki peluang pengembangan algoritma yang menjadi pembeda.\\n\\n## Saran saya sebagai arah pembimbingan\\n\\nSaya justru tertarik pada **FOOT-GUARD**\\\\.\\n\\nAlasannya\\\\:\\n\\n- Permasalahan kaki diabetik nyata dan relevan.\\n- Tidak perlu membuat perangkat medis yang terlalu rumit.\\n- Bisa menggunakan 4–6 sensor tekanan FSR.\\n- Ada unsur elektronika, pengolahan sinyal, dan komunikasi nirkabel.\\n- Hasilnya bisa diperlihatkan secara langsung melalui visualisasi tekanan kaki.\\n\\nYang membuatnya lebih menarik adalah fitur peringatan berdasarkan akumulasi tekanan dan durasi, sehingga inovasinya bukan sekadar alas kaki dengan sensor tekanan.\\n\\n**Satu pertanyaan penting\\\\:** Berapa kisaran dana yang tersedia untuk satu tim PKM?\\n\\n**Penyesuaian rancangan prototype**\\n\\nAnggaran pengembangan alat\\n\\nDi bawah Rp500 ribu\\n\\nRp500 ribu–Rp1 juta\\n\\nRp1 juta–Rp2 juta\\n\\nDi atas Rp2 juta\\n\\n---\\n\\nJumlah anggota tim\\n\\n3 mahasiswa\\n\\n3–4 mahasiswa\\n\\n5 mahasiswa\\n\\n[Sesuaikan ide dengan anggaran]\\n\\n---\\n\\nIf you want, I can:\\n\\n- Minta lanjutkan penjelasan parameter keberhasilan prototype\\n- Minta contoh rancangan detail metode pengembangan untuk PULMO-SCAN\\n- Minta langkah-langkah persiapan presentasi untuk PKM-KC dengan judul PULMO-SCAN\",\"fallbackMarkdownVersion\",\"requiredComponents\",[371],\"appData\",{\"_349\":350},\"opGenui\",{\"_351\":352,\"_353\":354,\"_355\":356},\"componentResults\",{\"_330\":357,\"_319\":358,\"_308\":359,\"_297\":360,\"_286\":361,\"_275\":362,\"_264\":363,\"_249\":364},\"interactionSurface\",\"mainline\",\"modelDataBindings\",{},{\"_165\":365,\"_366\":505,\"_62\":506,\"_369\":34,\"_370\":371},{\"_165\":365,\"_366\":490,\"_62\":491,\"_369\":34,\"_370\":371},{\"_165\":365,\"_366\":476,\"_62\":477,\"_369\":34,\"_370\":371},{\"_165\":365,\"_36 3,\"_45\":504},{\"_404\":501,\"_406\":502},0.4353982300884956,0.23923444976076555,565,418,{\"_372\":257,\"_373\":258,\"_374\":258,\"_375\":67,\"_376\":-5,\"_377\":507,\"_379\":14,\"_380\":381,\"_382\":14,\"_383\":508,\"_385\":-5},[229,219,220],{\"_410\":411,\"_412\":-5,\"_413\":414,\"_415\":34},[509],{\"_41\":229,\"_387\":219,\"_388\":220,\"_389\":510,\"_391\":392,\"_53\":511,\"_394\":512,\"_396\":34,\"_397\":513,\"_399\":514,\"_401\":515,\"_403\":14},\"https://files.seeedstudio.com/wiki/Wio_RP2040_mini_Dev_Board-Onboard_Wifi/Wireless-Fall-Detection-Device/device.jpg\",\"Wireless Fall Detection Device | Seeed Studio Wiki\",\"wearable fall detection pendant ESP32 accelerometer prototype\",{\"_43\":518,\"_45\":519},{\"_43\":518,\"_45\":519},{\"_404\":516,\"_406\":517},0.3552278820375335,0.0967032967032967,746,455,\"0\",\"Menurut saya, untuk PKM-KC justru lebih baik memilih inovasi yang \",\"1\",\"sederhana, murah, mudah dibuat, tetapi menyelesaikan masalah kesehatan yang nyata\",\"2\",\". Tidak harus menggunakan AI yang kompleks atau banyak sensor. Yang penting ada kebaruan, fungsi alat jelas, dan manfaatnya bisa dibuktikan.\",\"3\",\"Saya coba arahkan ke ide yang realistis dikerjakan mahasiswa Sistem Telekomunikasi dengan komponen yang relatif terjangkau.\",\"4\",\"8 ide PKM-KC sederhana tetapi berdampak\",\"5\",\"1. FALL-SAFE: Alat Deteksi Jatuh untuk Lansia\",\"6\",\"Sangat direkomendasikan\",\"7\",\"8\",\"Judul:\",\"9\",\" FALL-SAFE: Wearable Fall Detection Berbasis Accelerometer dan Komunikasi Bluetooth untuk Sistem Peringatan Darurat pada Lansia.\",\"10\",\"Masalah: Lansia yang jatuh terkadang tidak mampu meminta pertolongan.\",\"11\",\"Inovasi: Alat kecil yang dikenakan di tubuh untuk mendeteksi gerakan jatuh.\",\"12\",\"Teknologi: ESP32, accelerometer MPU6050, Bluetooth, buzzer.\",\"13\",\"Kebaruan: Deteksi jatuh dengan mempertimbangkan pola gerakan sebelum dan sesudah benturan untuk mengurangi alarm palsu.\",\"14\",\"Metode: Merancang alat, mengembangkan algoritma ambang gerak, menguji berbagai simulasi gerakan jatuh dan aktivitas normal.\",\"15\",\"Luaran: Wearable pendeteksi jatuh dan aplikasi notifikasi keluarga.\",\"16\",\"2. MEDI-REMINDER: Pengingat Obat untuk Pasien Lansia\",\"17\",\"18\",\"19\",\" MEDI-REMINDER: Kotak Obat Pintar Berbasis IoT dengan Notifikasi Nirkabel untuk Meningkatkan Kepatuhan Konsumsi Obat pada Lansia.\",\"20\",\"Masalah: Pasien lansia sering lupa jadwal minum obat.\",\"21\",\"Inovasi: Kotak obat yang memberikan alarm sesuai jadwal dan notifikasi kepada keluarga jika obat belum diambil.\",\"22\",\"Teknologi: ESP32, RTC, buzzer, LED, sensor buka-tutup, Wi-Fi.\",\"23\",\"Kebaruan: Pencatatan waktu pembukaan kompartemen dan notifikasi ketika jadwal terlewat.\",\"24\",\"Metode: Merancang kotak obat, mengintegrasikan sensor, membuat sistem jadwal, menguji ketepatan waktu dan notifikasi.\",\"25\",\"Luaran: Prototype kotak obat pintar.\",\"26\",\"3. POSTURE-BAND: Pengingat Postur Tubuh\",\"27\",\"28\",\"29\",\" POSTURE-BAND: Wearable Sensor Berbasis IMU dengan Notifikasi Getaran untuk Pencegahan Kebiasaan Postur Tubuh yang Buruk.\",\"30\",\"Masalah: Kebiasaan duduk membungkuk dapat menyebabkan keluhan muskuloskeletal.\",\"31\",\"Inovasi: Alat yang mendeteksi kemiringan tubuh dan memberikan getaran ketika posisi buruk berlangsung terlalu lama.\",\"32\",\"Teknologi: ESP32, MPU6050, motor getar.\",\"33\",\"Kebaruan: Deteksi postur berdasarkan durasi dan sudut kemiringan, bukan hanya perubahan posisi sesaat.\",\"34\",\"Metode: Kalibrasi sensor, pengembangan algoritma sudut, pengujian berbagai posisi duduk.\",\"35\",\"Luaran: Wearable pengingat postur.\",\"36\",\"4. DEHYDRA-SENSE: Monitoring Risiko Dehidrasi\",\"37\",\"38\",\"39\",\" DEHYDRA-SENSE: Wearable Monitoring Suhu Kulit dan Aktivitas Berbasis IoT sebagai Sistem Peringatan Risiko Dehidrasi.\",\"40\",\"Masalah: Dehidrasi sering tidak disadari, khususnya pada anak dan lansia.\",\"41\",\"Inovasi: Perangkat yang memantau suhu kulit dan aktivitas sebagai informasi pendukung risiko dehidrasi.\",\"42\",\"Teknologi: Sensor suhu, accelerometer, ESP32, Bluetooth.\",\"43\",\"Kebaruan: Penggabungan data suhu kulit dan aktivitas untuk menghasilkan peringatan kontekstual.\",\"44\",\"Metode: Integrasi sensor, pengolahan data, pengujian stabilitas dan respons sistem.\",\"45\",\"Luaran: Wearable monitoring dan aplikasi pengingat minum.\",\"46\",\"Catatan: suhu kulit dan aktivitas tidak cukup untuk memastikan dehidrasi. Alat ini harus diposisikan sebagai pengingat hidrasi, bukan alat diagnosis.\",\"47\",\"5. BREATH-ALERT: Pengingat dan Monitoring Pola Pernapasan\",\"48\",\"49\",\"50\",\" BREATH-ALERT: Portable Respiratory Rate Monitor Berbasis Sensor Stretch dan Wireless Communication untuk Pemantauan Frekuensi Pernapasan.\",\"51\",\"Masalah: Frekuensi pernapasan merupakan parameter penting dalam pemantauan kondisi kesehatan.\",\"52\",\"Inovasi: Alat sederhana untuk mengukur frekuensi napas secara berkala.\",\"53\",\"Teknologi: Stretch sensor, ESP32, Bluetooth.\",\"54\",\"Kebaruan: Pengolahan sinyal untuk menghitung pola inspirasi dan ekspirasi serta mendeteksi perubahan frekuensi napas.\",\"55\",\"Metode: Akuisisi sinyal, filtering, perhitungan frekuensi, pengujian terhadap penghitungan manual.\",\"56\",\"Luaran: Prototype alat monitoring pernapasan.\",\"57\",\"6. FOOT-GUARD: Peringatan Tekanan Berlebih pada Telapak Kaki\",\"58\",\"59\",\"60\",\" FOOT-GUARD: Smart Insole Berbasis Pressure Sensor dan Wireless Alert untuk Monitoring Distribusi Tekanan Telapak Kaki pada Penderita Diabetes.\",\"61\",\"Masalah: Penderita diabetes berisiko mengalami luka kaki akibat gangguan sensitivitas dan tekanan berulang.\",\"62\",\"Inovasi: Alas kaki yang memantau titik tekanan tinggi dan memberikan peringatan.\",\"63\",\"Teknologi: FSR sensor, ESP32, buzzer, Bluetooth.\",\"64\",\"Kebaruan: Peringatan berdasarkan durasi tekanan berlebih, bukan hanya besarnya tekanan.\",\"65\",\"Metode: Integrasi sensor, kalibrasi tekanan, pengujian distribusi beban dan alarm.\",\"66\",\"Luaran: Prototype smart insole.\",\"67\",\"7. COUGH-COUNT: Penghitung Frekuensi Batuk Otomatis\",\"68\",\"69\",\"70\",\" COUGH-COUNT: Portable Acoustic Cough Monitoring Berbasis Digital Signal Processing untuk Pemantauan Frekuensi Batuk Harian.\",\"71\",\"Masalah: Frekuensi batuk sering tidak tercatat secara objektif.\",\"72\",\"Inovasi: Perangkat yang mendeteksi dan mencatat kejadian batuk.\",\"73\",\"Teknologi: Mikrofon, ESP32, DSP, Bluetooth.\",\"74\",\"Kebaruan: Deteksi batuk dengan pemisahan suara lingkungan dan pencatatan frekuensi harian.\",\"75\",\"Metode: Perekaman suara, filtering, ekstraksi fitur akustik, klasifikasi sederhana dan pengujian.\",\"76\",\"Luaran: Prototype penghitung batuk otomatis.\",\"77\",\"8. SAFE-HEAT: Alarm Suhu Tubuh untuk Anak\",\"78\",\"79\",\"80\",\" SAFE-HEAT: Wearable Temperature Monitoring Berbasis IoT dengan Sistem Peringatan Dini Perubahan Suhu Tubuh Anak.\",\"81\",\"Masalah: Orang tua kesulitan memantau perubahan suhu anak secara berkala, khususnya saat tidur.\",\"82\",\"Inovasi: Sensor suhu yang mengirimkan notifikasi saat pembacaan mencapai ambang yang ditentukan.\",\"83\",\"Teknologi: Sensor suhu kontak, ESP32, Bluetooth, buzzer.\",\"84\",\"Kebaruan: Monitoring suhu kontinu dengan pencatatan tren dan notifikasi otomatis.\",\"85\",\"Metode: Kalibrasi sensor terhadap termometer referensi, pengujian kestabilan dan notifikasi.\",\"86\",\"Luaran: Prototype wearable temperature monitor.\",\"87\",\"Catatan: sensor harus dikalibrasi dengan baik dan pembacaan suhu kulit tidak boleh dianggap sama dengan suhu inti tubuh.\",\"88\",\"Perbandingan ide berdasarkan kelayakan PKM-KC\",\"89\",\"Penilaian berikut merupakan estimasi awal berdasarkan kompleksitas pengembangan, biaya relatif, dan kemudahan demonstrasi.\",\"90\",\"Ide\",\"91\",\"Biaya relatif\",\"92\",\"Kesulitan\",\"93\",\"Dampak potensial\",\"94\",\"FALL-SAFE\",\"95\",\"Rendah\",\"96\",\"Mudah\",\"97\",\"Tinggi\",\"98\",\"MEDI-REMINDER\",\"99\",\ adio\\\",{\\\"value\\\":\\\"Di atas Rp2 juta\\\"},__dilConstants[\\\"154\\\"]))),null),__dil.jsx(\\\"divider\\\",{\\\"color\\\":\\\"subtle\\\"}),__dil.jsx(\\\"text\\\",{\\\"weight\\\":\\\"medium\\\",\\\"size\\\":\\\"sm\\\"},__dilConstants[\\\"155\\\"]),__dilSafe(()=\u003e(__dil.jsx(\\\"radio-group\\\",{\\\"direction\\\":\\\"col\\\",\\\"value\\\":teamSize,\\\"onChange\\\":setTeamSize},__dil.jsx(\\\"radio\\\",{\\\"value\\\":\\\"3 mahasiswa\\\"},__dilConstants[\\\"156\\\"]),__dil.jsx(\\\"radio\\\",{\\\"value\\\":\\\"3–4 mahasiswa\\\"},__dilConstants[\\\"157\\\"]),__dil.jsx(\\\"radio\\\",{\\\"value\\\":\\\"5 mahasiswa\\\"},__dilConstants[\\\"158\\\"]))),null),__dilSafe(()=\u003e(__dil.jsx(\\\"button\\\",{\\\"block\\\":true,\\\"onClick\\\":()=\u003eGenUI.issueNewTurn(\\\"Sesuaikan ide PKM-KC kesehatan dan telekomunikasi yang sederhana dengan anggaran \\\"+budget+\\\" dan tim \\\"+teamSize+\\\". Pilihkan 3 judul terbaik, rincian komponen, estimasi biaya, novelty, dan rancangan prototype.\\\")},__dilConstants[\\\"159\\\"])),null)));},{\\\"key\\\":\\\"body:2\\\"}));\",\"hidden\",\"\",0,[229,219,220,227,223,222,228,215,216,232,211,217,226,212,221,231,225,210,230,224,218,209,213,214],\"stop\",\"stop_tokens\",[854],200002,\"content_type\",\"text\",\"parts\",[859],\"Menurut saya, untuk PKM-KC justru lebih baik memilih inovasi yang **sederhana, murah, mudah dibuat, tetapi menyelesaikan masalah kesehatan yang nyata**. Tidak harus menggunakan AI yang kompleks atau banyak sensor. Yang penting ada kebaruan, fungsi alat jelas, dan manfaatnya bisa dibuktikan.\\n\\nSaya coba arahkan ke ide yang realistis dikerjakan mahasiswa Sistem Telekomunikasi dengan komponen yang relatif terjangkau.\\n\\n# 8 ide PKM-KC sederhana tetapi berdampak\\n\\n## 1. FALL-SAFE: Alat Deteksi Jatuh untuk Lansia\\n\\n\u003cbadge color=\\\"success\\\"\u003eSangat direkomendasikan\u003c/badge\u003e\\n\u003cAsyncImage query=\\\"wearable fall detection pendant ESP32 accelerometer prototype\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Judul:** FALL-SAFE: Wearable Fall Detection Berbasis Accelerometer dan Komunikasi Bluetooth untuk Sistem Peringatan Darurat pada Lansia.\\n\\n- Masalah: Lansia yang jatuh terkadang tidak mampu meminta pertolongan.\\n- Inovasi: Alat kecil yang dikenakan di tubuh untuk mendeteksi gerakan jatuh.\\n- Teknologi: ESP32, accelerometer MPU6050, Bluetooth, buzzer.\\n- Kebaruan: Deteksi jatuh dengan mempertimbangkan pola gerakan sebelum dan sesudah benturan untuk mengurangi alarm palsu.\\n- Metode: Merancang alat, mengembangkan algoritma ambang gerak, menguji berbagai simulasi gerakan jatuh dan aktivitas normal.\\n- Luaran: Wearable pendeteksi jatuh dan aplikasi notifikasi keluarga.\\n\\n## 2. MEDI-REMINDER: Pengingat Obat untuk Pasien Lansia\\n\\n\u003cAsyncImage query=\\\"smart pill box medicine reminder ESP32 electronic prototype\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Judul:** MEDI-REMINDER: Kotak Obat Pintar Berbasis IoT dengan Notifikasi Nirkabel untuk Meningkatkan Kepatuhan Konsumsi Obat pada Lansia.\\n\\n- Masalah: Pasien lansia sering lupa jadwal minum obat.\\n- Inovasi: Kotak obat yang memberikan alarm sesuai jadwal dan notifikasi kepada keluarga jika obat belum diambil.\\n- Teknologi: ESP32, RTC, buzzer, LED, sensor buka-tutup, Wi-Fi.\\n- Kebaruan: Pencatatan waktu pembukaan kompartemen dan notifikasi ketika jadwal terlewat.\\n- Metode: Merancang kotak obat, mengintegrasikan sensor, membuat sistem jadwal, menguji ketepatan waktu dan notifikasi.\\n- Luaran: Prototype kotak obat pintar.\\n\\n## 3. POSTURE-BAND: Pengingat Postur Tubuh\\n\\n\u003cAsyncImage query=\\\"wearable posture correction sensor vibration device prototype\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Judul:** POSTURE-BAND: Wearable Sensor Berbasis IMU dengan Notifikasi Getaran untuk Pencegahan Kebiasaan Postur Tubuh yang Buruk.\\n\\n- Masalah: Kebiasaan duduk membungkuk dapat menyebabkan keluhan muskuloskeletal.\\n- Inovasi: Alat yang mendeteksi kemiringan tubuh dan memberikan getaran ketika posisi buruk berlangsung terlalu lama.\\n- Teknologi: ESP32, MPU6050, motor getar.\\n- Kebaruan: Deteksi postur berdasarkan durasi dan sudut kemiringan, bukan hanya perubahan posisi sesaat.\\n- Metode: Kalibrasi sensor, pengembangan algoritma sudut, pengujian berbagai posisi duduk.\\n- Luaran: Wearable pengingat postur.\\n\\n## 4. DEHYDRA-SENSE: Monitoring Risiko Dehidrasi\\n\\n\u003cAsyncImage query=\\\"wearable skin temperature humidity sensor health monitoring prototype wristband\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Judul:** DEHYDRA-SENSE: Wearable Monitoring Suhu Kulit dan Aktivitas Berbasis IoT sebagai Sistem Peringatan Risiko Dehidrasi.\\n\\n- Masalah: Dehidrasi sering tidak disadari, khususnya pada anak dan lansia.\\n- Inovasi: Perangkat yang memantau suhu kulit dan aktivitas sebagai informasi pendukung risiko dehidrasi.\\n- Teknologi: Sensor suhu, accelerometer, ESP32, Bluetooth.\\n- Kebaruan: Penggabungan data suhu kulit dan aktivitas untuk menghasilkan peringatan kontekstual.\\n- Metode: Integrasi sensor, pengolahan data, pengujian stabilitas dan respons sistem.\\n- Luaran: Wearable monitoring dan aplikasi pengingat minum.\\n\\nCatatan: suhu kulit dan aktivitas tidak cukup untuk memastikan dehidrasi. Alat ini harus diposisikan sebagai pengingat hidrasi, bukan alat diagnosis.\\n\\n## 5. BREATH-ALERT: Pengingat dan Monitoring Pola Pernapasan\\n\\n\u003cAsyncImage query=\\\"portable respiratory breathing rate sensor wearable chest band prototype\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Judul:** BREATH-ALERT: Portable Respiratory Rate Monitor Berbasis Sensor Stretch dan Wireless Communication untuk Pemantauan Frekuensi Pernapasan.\\n\\n- Masalah: Frekuensi pernapasan merupakan parameter penting dalam pemantauan kondisi kesehatan.\\n- Inovasi: Alat sederhana untuk mengukur frekuensi napas secara berkala.\\n- Teknologi: Stretch sensor, ESP32, Bluetooth.\\n- Kebaruan: Pengolahan sinyal untuk menghitung pola inspirasi dan ekspirasi serta mendeteksi perubahan frekuensi napas.\\n- Metode: Akuisisi sinyal, filtering, perhitungan frekuensi, pengujian terhadap penghitungan manual.\\n- Luaran: Prototype alat monitoring pernapasan.\\n\\n## 6. FOOT-GUARD: Peringatan Tekanan Berlebih pada Telapak Kaki\\n\\n\u003cAsyncImage query=\\\"pressure sensor smart footwear insole electronics prototype\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Judul:** FOOT-GUARD: Smart Insole Berbasis Pressure Sensor dan Wireless Alert untuk Monitoring Distribusi Tekanan Telapak Kaki pada Penderita Diabetes.\\n\\n- Masalah: Penderita diabetes berisiko mengalami luka kaki akibat gangguan sensitivitas dan tekanan berulang.\\n- Inovasi: Alas kaki yang memantau titik tekanan tinggi dan memberikan peringatan.\\n- Teknologi: FSR sensor, ESP32, buzzer, Bluetooth.\\n- Kebaruan: Peringatan berdasarkan durasi tekanan berlebih, bukan hanya besarnya tekanan.\\n- Metode: Integrasi sensor, kalibrasi tekanan, pengujian distribusi beban dan alarm.\\n- Luaran: Prototype smart insole.\\n\\n## 7. COUGH-COUNT: Penghitung Frekuensi Batuk Otomatis\\n\\n\u003cAsyncImage query=\\\"portable cough detection wearable microphone sensor ESP32 prototype\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Judul:** COUGH-COUNT: Portable Acoustic Cough Monitoring Berbasis Digital Signal Processing untuk Pemantauan Frekuensi Batuk Harian.\\n\\n- Masalah: Frekuensi batuk sering tidak tercatat secara objektif.\\n- Inovasi: Perangkat yang mendeteksi dan mencatat kejadian batuk.\\n- Teknologi: Mikrofon, ESP32, DSP, Bluetooth.\\n- Kebaruan: Deteksi batuk dengan pemisahan suara lingkungan dan pencatatan frekuensi harian.\\n- Metode: Perekaman suara, filtering, ekstraksi fitur akustik, klasifikasi sederhana dan pengujian.\\n- Luaran: Prototype penghitung batuk otomatis.\\n\\n## 8. SAFE-HEAT: Alarm Suhu Tubuh untuk Anak\\n\\n\u003cAsyncImage query=\\\"wearable child body temperature monitoring patch sensor electronic prototype\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Judul:** SAFE-HEAT: Wearable Temperature Monitoring Berbasis IoT dengan Sistem Peringatan Dini Perubahan Suhu Tubuh Anak.\\n\\n- Masalah: Orang tua kesulitan memantau perubahan suhu anak secara berkala, khususnya saat tidur.\\n- Inovasi: Sensor suhu yang mengirimkan notifikasi saat pembacaan mencapai ambang yang ditentukan.\\n- Teknologi: Sensor suhu kontak, ESP32, Bluetooth, buzzer.\\n- Kebaruan: Monitoring suhu kontinu dengan pencatatan tren dan notifikasi otomatis.\\n- Metode: Kalibrasi sensor terhadap termometer referensi, pengujian kestabilan dan notifikasi.\\n- Luaran: Prototype wearable temperature monitor.\\n\\nCatatan: sensor harus dikalibrasi dengan baik dan pembacaan suhu kulit tidak boleh dianggap sama dengan suhu inti tubuh.\\n\\n---\\n\\n# Perbandingan ide berdasarkan kelayakan PKM-KC\\n\\nPenilaian berikut merupakan estimasi awal berdasarkan kompleksitas pengembangan, biaya relatif, dan kemudahan demonstrasi.\\n\\n| Ide | Biaya relatif | Kesulitan | Dampak potensial |\\n|---|---|---|---|\\n| FALL-SAFE | Rendah | Mudah | Tinggi |\\n| MEDI-REMINDER | Rendah | Sangat mudah | Tinggi |\\n| POSTURE-BAND | Rendah | Mudah | Sedang–tinggi |\\n| DEHYDRA-SENSE | Sedang | Sedang | Tinggi |\\n| BREATH-ALERT | Rendah | Sedang | Tinggi |\\n| FOOT-GUARD | Sedang | Sedang | Tinggi |\\n| COUGH-COUNT | Rendah | Sedang | Tinggi |\\n| SAFE-HEAT | Rendah–sedang | Mudah | Tinggi |\\n\\n# Tiga ide yang paling saya sarankan\\n\\n\u003cbox border radius=\\\"lg\\\" padding={3} gap={3}\u003e\\n  \u003cbox gap={1}\u003e\\n    \u003cbadge color=\\\"success\\\"\u003ePaling mudah direalisasikan\u003c/badge\u003e\\n    **1. MEDI-REMINDER**\\n\\n    Alasan: komponen mudah diperoleh, perakitan relatif sederhana, dan manfaatnya langsung dirasakan pasien lansia.\\n  \u003c/box\u003e\\n  \u003cdivider color=\\\"subtle\\\"/\u003e\\n  \u003cbox gap={1}\u003e\\n    \u003cbadge color=\\\"success\\\"\u003eKeseimbangan inovasi dan manfaat\u003c/badge\u003e\\n    **2. FOOT-GUARD**\\n\\n    Alasan: memiliki hubungan kuat dengan bidang kesehatan, sensor, pengolahan data, dan telekomunikasi. Bentuk prototype juga menarik untuk demonstrasi.\\n  \u003c/box\u003e\\n  \u003cdivider color=\\\"subtle\\\"/\u003e\\n  \u003cbox gap={1}\u003e\\n    \u003cbadge color=\\\"success\\\"\u003ePotensi inovasi teknis\u003c/badge\u003e\\n    **3. COUGH-COUNT**\\n\\n    Alasan: sangat sesuai dengan kompetensi pengolahan sinyal digital dan telekomunikasi, serta memiliki peluang pengembangan algoritma yang menjadi pembeda.\\n  \u003c/box\u003e\\n\u003c/box\u003e\\n\\n## Saran saya sebagai arah pembimbingan\\n\\nSaya justru tertarik pada **FOOT-GUARD**.\\n\\nAlasannya:\\n- Permasalahan kaki diabetik nyata dan relevan.\\n- Tidak perlu membuat perangkat medis yang terlalu rumit.\\n- Bisa menggunakan 4–6 sensor tekanan FSR.\\n- Ada unsur elektronika, pengolahan sinyal, dan komunikasi nirkabel.\\n- Hasilnya bisa diperlihatkan secara langsung melalui visualisasi tekanan kaki.\\n\\nYang membuatnya lebih menarik adalah fitur peringatan berdasarkan akumulasi tekanan dan durasi, sehingga inovasinya bukan sekadar alas kaki dengan sensor tekanan.\\n\\n**Satu pertanyaan penting:** Berapa kisaran dana yang tersedia untuk satu tim PKM?\\n\\n{@body const [budget,setBudget] = DIL.useState(\\\"Rp500 ribu–Rp1 juta\\\")}\\n{@body const [teamSize,setTeamSize] = DIL.useState(\\\"3–4 mahasiswa\\\")}\\n\u003cbox border radius=\\\"lg\\\" padding={3} gap={3}\u003e\\n  **Penyesuaian rancangan prototype**\\n  \u003ctext weight=\\\"medium\\\" size=\\\"sm\\\"\u003eAnggaran pengembangan alat\u003c/text\u003e\\n  \u003cradio-group direction=\\\"col\\\" value={budget} onChange={setBudget}\u003e\\n    \u003cradio value=\\\"Di bawah Rp500 ribu\\\"\u003eDi bawah Rp500 ribu\u003c/radio\u003e\\n    \u003cradio value=\\\"Rp500 ribu–Rp1 juta\\\"\u003eRp500 ribu–Rp1 juta\u003c/radio\u003e\\n    \u003cradio value=\\\"Rp1 juta–Rp2 juta\\\"\u003eRp1 juta–Rp2 juta\u003c/radio\u003e\\n    \u003cradio value=\\\"Di atas Rp2 juta\\\"\u003eDi atas Rp2 juta\u003c/radio\u003e\\n  \u003c/radio-group\u003e\\n  \u003cdivider color=\\\"subtle\\\"/\u003e\\n  \u003ctext weight=\\\"medium\\\" size=\\\"sm\\\"\u003eJumlah anggota tim\u003c/text\u003e\\n  \u003cradio-group direction=\\\"col\\\" value={teamSize} onChange={setTeamSize}\u003e\\n    \u003cradio value=\\\"3 mahasiswa\\\"\u003e3 mahasiswa\u003c/radio\u003e\\n    \u003cradio value=\\\"3–4 mahasiswa\\\"\u003e3–4 mahasiswa\u003c/radio\u003e\\n    \u003cradio value=\\\"5 mahasiswa\\\"\u003e5 mahasiswa\u003c/radio\u003e\\n  \u003c/radio-group\u003e\\n  \u003cbutton block onClick={()=\u003eGenUI.issueNewTurn(\\\"Sesuaikan ide PKM-KC kesehatan dan telekomunikasi yang sederhana dengan anggaran \\\"+budget+\\\" dan tim \\\"+teamSize+\\\". Pilihkan 3 judul terbaik, rincian komponen, estimasi biaya, novelty, dan rancangan prototype.\\\")}\u003eSesuaikan ide dengan anggaran\u003c/button\u003e\\n\u003c/box\u003e\\n\\n---\\n\\nIf you want, I can:\\n\\n- Minta lanjutkan penjelasan parameter keberhasilan prototype\\n- Minta contoh rancangan detail metode pengembangan untuk PULMO-SCAN\\n- Minta langkah-langkah persiapan presentasi untuk PKM-KC dengan judul PULMO-SCAN\",\"role\",\"assistant\",{},{\"_152\":156,\"_159\":866,\"_54\":867,\"_56\":867,\"_163\":868,\"_165\":166,\"_168\":169,\"_170\":869,\"_172\":173},\"bbb217f7-fe0b-499e-97fe-85697cb4aa3a\",[81],{\"_860\":873,\"_170\":874},1795414412.373653,{\"_855\":856,\"_857\":872},{\"_870\":34,\"_206\":871,\"_190\":109,\"_193\":194,\"_196\":197,\"_198\":199,\"_200\":201,\"_202\":201,\"_203\":109,\"_66\":67,\"_205\":864,\"_208\":10,\"_204\":14},\"is_visually_hidden_from_conversation\",\"76bcc3f6-0ad5-5ac7-bdb8-c97a05a0db95\",[848],\"system\",{},{\"_152\":864,\"_159\":878,\"_54\":879,\"_56\":880,\"_163\":881,\"_165\":166,\"_168\":169,\"_170\":882,\"_172\":173},\"0c40c6bf-04f4-4537-af ],{\"_50\":945,\"_41\":925,\"_53\":978,\"_947\":848,\"_948\":979,\"_950\":980,\"_951\":952,\"_954\":975},\"Inovasi Cardioguard Antarkan Mahasiswa DTETI Raih Emas dan Perak PIMNAS 38 – jteti ft ugm\",{\"_955\":956,\"_957\":958,\"_959\":981},1768176000,4,\"fkep.unpad.ac.id\",[984],{\"_50\":945,\"_41\":921,\"_53\":985,\"_947\":848,\"_948\":986,\"_950\":987,\"_951\":952,\"_953\":988,\"_954\":982},\"Tim PKM-KC Fakultas Keperawatan Unpad Raih Juara 2 Kategori Poster di PIMNAS ke-38 – Fakultas Keperawatan Universitas Padjadjaran – FKEP UNPAD\",{\"_955\":956,\"_957\":958,\"_959\":838},1764460800,\"Fakultas Keperawatan Universitas Padjadjaran - FKEP UNPAD\",\"dikti.go.id\",[991],{\"_50\":945,\"_41\":920,\"_53\":992,\"_947\":848,\"_948\":993,\"_950\":965,\"_951\":952,\"_954\":989},\"Kementerian Pendidikan Tinggi, Sains, dan Teknologi\",{\"_955\":956,\"_957\":958,\"_959\":169},\"id.scribd.com\",[996,997],{\"_50\":945,\"_41\":923,\"_53\":1001,\"_947\":848,\"_948\":1002,\"_950\":-5,\"_951\":952,\"_953\":1000,\"_954\":994},{\"_50\":945,\"_41\":924,\"_53\":998,\"_947\":848,\"_948\":999,\"_950\":-5,\"_951\":952,\"_953\":1000,\"_954\":994},\"Template PKM-KC 2025 | PDF\",{\"_955\":956,\"_957\":958,\"_959\":823},\"Scribd\",\"Pemenang Pimnas 2025: Inovasi Terbaik | PDF\",{\"_955\":956,\"_957\":958,\"_959\":849},\"simbelmawa.kemdiktisaintek.go.id\",[1005,1006,1007],{\"_50\":945,\"_41\":929,\"_53\":1016,\"_947\":848,\"_948\":1017,\"_950\":-5,\"_951\":1011,\"_954\":1003},{\"_50\":945,\"_41\":928,\"_53\":1008,\"_947\":848,\"_948\":1013,\"_950\":1014,\"_951\":1011,\"_954\":1003},{\"_50\":945,\"_41\":927,\"_53\":1008,\"_947\":848,\"_948\":1009,\"_950\":1010,\"_951\":1011,\"_954\":1003},\"\u003ctable id=\\\"e1\\\"\u003e\",{\"_955\":956,\"_957\":958,\"_959\":1012},1772813645,\"web-pdf\",34,{\"_955\":956,\"_957\":958,\"_959\":1015},1772813549,33,\"Draf SK Pemenang PIMNAS 2025\",{\"_955\":956,\"_957\":958,\"_959\":1018},32,{\"_812\":1020,\"_1021\":-5,\"_814\":1022,\"_816\":1023,\"_62\":1024,\"_1025\":1026,\"_47\":848,\"_818\":-5,\"_50\":1027,\"_1028\":1029,\"_1030\":14},\" \",\"prefix\",8000,8001,[],\"refs\",[],\"sources_footnote\",\"sources\",[],\"has_images\",[854],[1033],\"## B. Perbandingan dan pemeringkatan potensi judul\\n\\nUntuk menentukan mana yang paling layak dikembangkan, berikut perbandingan berdasarkan aspek kebaruan, keterkaitan dengan Telekomunikasi, dan kemudahan pembuatan prototype.\\n\\n| No. | Judul | Kebaruan teknologi | Kesesuaian Telekomunikasi | Kompleksitas |\\n|---|---|---|---|---|\\n| 1 | PULMO-SCAN | Tinggi | Sangat tinggi | Sedang |\\n| 2 | VASCULAR-SENSE | Tinggi | Sangat tinggi | Tinggi |\\n| 3 | NEUROSTEP | Tinggi | Sangat tinggi | Sedang |\\n| 4 | THROMBO-ALERT | Tinggi | Sangat tinggi | Tinggi |\\n| 5 | RENAL-WATCH | Tinggi | Sangat tinggi | Tinggi |\\n| 6 | RETINA-LINK | Sedang–tinggi | Tinggi | Tinggi |\\n| 7 | CARDIO-VOICE | Tinggi | Sangat tinggi | Sedang |\\n| 8 | STROKE-MON | Tinggi | Sangat tinggi | Tinggi |\\n| 9 | OXYSENSE | Sedang–tinggi | Sangat tinggi | Sedang |\\n| 10 | ORAL-SCAN | Tinggi | Tinggi | Tinggi |\\n\\n*Penilaian tersebut merupakan pertimbangan awal konseptual, bukan hasil pengukuran novelty atau penilaian resmi reviewer.*\\n\\n## C. Tiga judul yang paling saya rekomendasikan\\n\\n\u003cbox border radius=\\\"lg\\\" padding={3} gap={3}\u003e\\n  \u003crow align=\\\"center\\\" justify=\\\"between\\\"\u003e\\n    **1. PULMO-SCAN**\\n    \u003cbadge color=\\\"success\\\"\u003ePilihan pertama\u003c/badge\u003e\\n  \u003c/row\u003e\\n  \u003cAsyncImage query=\\\"portable digital respiratory sound analyzer medical electronic stethoscope prototype\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n  **Alasan:**\\n  - Mengangkat masalah kesehatan yang relevan.\\n  - Sangat sesuai dengan keahlian pengolahan sinyal digital.\\n  - Dapat menggabungkan elektronika, sensor, AI, dan IoT.\\n  - Memiliki potensi menghasilkan prototype yang bisa didemonstrasikan.\\n\\n  **Keunggulan presentasi:** mahasiswa dapat memperlihatkan proses perekaman suara napas, pemrosesan sinyal, hingga hasil analisis secara langsung.\\n  \u003cdivider color=\\\"subtle\\\"/\u003e\\n  \u003crow align=\\\"center\\\" justify=\\\"between\\\"\u003e\\n    **2. NEUROSTEP**\\n    \u003cbadge color=\\\"success\\\"\u003ePilihan kedua\u003c/badge\u003e\\n  \u003c/row\u003e\\n  \u003cAsyncImage query=\\\"smart pressure sensing insole gait analysis prototype electronics\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n  **Alasan:**\\n  - Bentuk produknya konkret dan mudah dipahami reviewer.\\n  - Integrasi sensor tekanan dan IMU memperlihatkan kompetensi elektronika telekomunikasi.\\n  - Data dapat ditampilkan secara visual dalam bentuk heatmap tekanan kaki.\\n  - Memiliki peluang pengembangan untuk monitoring pasien diabetes.\\n\\n  **Keunggulan presentasi:** reviewer dapat melihat langsung perubahan distribusi tekanan ketika seseorang berjalan.\\n  \u003cdivider color=\\\"subtle\\\"/\u003e\\n  \u003crow align=\\\"center\\\" justify=\\\"between\\\"\u003e\\n    **3. CARDIO-VOICE**\\n    \u003cbadge\u003eAlternatif ketiga\u003c/badge\u003e\\n  \u003c/row\u003e\\n  \u003cAsyncImage query=\\\"electronic digital phonocardiogram stethoscope prototype heart sound analyzer\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n  **Alasan:**\\n  - Sangat relevan dengan pengolahan sinyal digital.\\n  - Memiliki tantangan teknis yang jelas, seperti filtering, segmentasi, dan klasifikasi sinyal.\\n  - Dapat dikembangkan dengan komponen yang relatif terjangkau.\\n  - Demonstrasi prototype relatif menarik.\\n\\n  **Keunggulan presentasi:** menampilkan perbedaan karakteristik sinyal bunyi jantung dan hasil pemrosesan digital.\\n\u003c/box\u003e\\n\\n## D. Belajar dari pemenang PIMNAS 2025\\n\\nAda tiga karya PKM-KC bidang kesehatan yang menurut saya sangat relevan untuk dipelajari:\\n\\n| Karya | Prestasi PIMNAS 38 | Pelajaran untuk proposal baru |\\n|---|---|---|\\n| Sistem peringatan dini TB melalui suara batuk (ITS) | Emas KC-1 | Penggunaan sinyal akustik untuk skrining kesehatan |\\n| Cardioguard (UGM) | Perak KC-1 | Integrasi wearable, AI, IoT, dan perangkat keras |\\n| Orside (UGM) | Emas KC-2 | Integrasi teknologi sensor optik dan deep learning |\\n\\nSumber daftar pemenang: [SK Pemenang PIMNAS 2025](https://simbelmawa.kemdiktisaintek.go.id/portal/wp-content/uploads/2026/11/SK-Pemenang-PIMNAS-2025-Rev-1.pdf). Informasi Cardioguard juga dijelaskan oleh \u003cLink ref=\\\"turn950386search4\\\" title=\\\"Departemen Teknik Elektro dan Teknologi Informasi UGM\\\"/\u003e. \\n\\nHal yang perlu diperhatikan: jangan membuat proposal yang hanya mengganti nama perangkat atau mengganti algoritma dari karya pemenang. Misalnya, membuat ulang alat deteksi TB dengan suara batuk dan CNN saja belum menunjukkan kebaruan yang kuat.\\n\\nKita perlu memiliki pembeda pada mekanisme pengukuran, kombinasi sensor, metode pengolahan, atau fungsi perangkat.\\n\\n## E. Rekomendasi arsitektur teknologi\\n\\nAgar mahasiswa memiliki gambaran implementasi, berikut arsitektur umum yang bisa digunakan untuk ketiga judul unggulan.\\n\\n\u003cbox border radius=\\\"lg\\\" padding={3} gap={2}\u003e\\n  **Arsitektur prototype HealthTech berbasis Telekomunikasi**\\n  \u003cbox background=\\\"rgba(59,130,246,0.09)\\\" radius=\\\"md\\\" padding={3} align=\\\"center\\\"\u003e\\n    \u003cicon name=\\\"activity\\\" size=\\\"xl\\\" color=\\\"#3B82F6\\\"/\u003e\\n    **Sensor Akuisisi Kesehatan**\\n\\n    \u003ctext color=\\\"secondary\\\" size=\\\"xs\\\"\u003ePPG / Mikrofon / IMU / Pressure Sensor / EMG\u003c/text\u003e\\n  \u003c/box\u003e\\n  \u003cbox align=\\\"center\\\"\u003e\\n    \u003cicon name=\\\"arrow-down\\\" color=\\\"secondary\\\" size=\\\"lg\\\"/\u003e\\n  \u003c/box\u003e\\n  \u003cbox background=\\\"rgba(59,130,246,0.09)\\\" radius=\\\"md\\\" padding={3} align=\\\"center\\\"\u003e\\n    **Embedded System**\\n\\n    \u003ctext color=\\\"secondary\\\" size=\\\"xs\\\"\u003eESP32 / STM32 / Raspberry Pi\u003c/text\u003e\\n  \u003c/box\u003e\\n  \u003cbox align=\\\"center\\\"\u003e\\n    \u003cicon name=\\\"arrow-down\\\" color=\\\"secondary\\\" size=\\\"lg\\\"/\u003e\\n  \u003c/box\u003e\\n  \u003cbox background=\\\"rgba(16,185,129,0.10)\\\" radius=\\\"md\\\" padding={3} align=\\\"center\\\"\u003e\\n    **Digital Signal Processing**\\n\\n    \u003ctext color=\\\"secondary\\\" size=\\\"xs\\\"\u003eFiltering – Noise Reduction – Feature Extraction\u003c/text\u003e\\n  \u003c/box\u003e\\n  \u003cbox align=\\\"center\\\"\u003e\\n    \u003cicon name=\\\"arrow-down\\\" color=\\\"secondary\\\" size=\\\"lg\\\"/\u003e\\n  \u003c/box\u003e\\n  \u003cbox background=\\\"rgba(16,185,129,0.10)\\\" radius=\\\"md\\\" padding={3} align=\\\"center\\\"\u003e\\n    **Artificial Intelligence / Edge AI**\\n\\n    \u003ctext color=\\\"secondary\\\" size=\\\"xs\\\"\u003eKlasifikasi – Deteksi Anomali – Analisis Risiko\u003c/text\u003e\\n  \u003c/box\u003e\\n  \u003cbox align=\\\"center\\\"\u003e\\n    \u003cicon name=\\\"arrow-down\\\" color=\\\"secondary\\\" size=\\\"lg\\\"/\u003e\\n  \u003c/box\u003e\\n  \u003cbox background=\\\"rgba(245,158,11,0.10)\\\" radius=\\\"md\\\" padding={3} align=\\\"center\\\"\u003e\\n    **Wireless Communication**\\n\\n    \u003ctext color=\\\"secondary\\\" size=\\\"xs\\\"\u003eBluetooth / Wi-Fi / LoRa\u003c/text\u003e\\n  \u003c/box\u003e\\n  \u003cbox align=\\\"center\\\"\u003e\\n    \u003cicon name=\\\"arrow-down\\\" color=\\\"secondary\\\" size=\\\"lg\\\"/\u003e\\n  \u003c/box\u003e\\n  \u003cbox background=\\\"rgba(245,158,11,0.10)\\\" radius=\\\"md\\\" padding={3} align=\\\"center\\\"\u003e\\n    **Dashboard dan Sistem Peringatan**\\n\\n    \u003ctext color=\\\"secondary\\\" size=\\\"xs\\\"\u003eVisualisasi hasil – Riwayat pengukuran – Notifikasi\u003c/text\u003e\\n  \u003c/box\u003e\\n\u003c/box\u003e\\n\\n## F. Parameter keberhasilan prototype\\n\\nSaya menyarankan mahasiswa tidak hanya menguji apakah alat dapat menyala, tetapi juga melakukan pengujian teknis yang terukur.\\n\\n| Aspek pengujian | Parameter |\\n|---|---|\\n| Sensor | Akurasi, sensitivitas, repeatability |\\n| Pengolahan sinyal | SNR, noise reduction, kualitas sinyal |\\n| AI | Accuracy, precision, recall, F1-score, sensitivity, specificity |\\n| Telekomunikasi | Latency, packet loss, jangkauan komunikasi |\\n| Perangkat | Konsumsi daya, waktu operasi, kestabilan |\\n| Sistem | Keberhasilan integrasi seluruh modul |\\n\\nUntuk pengujian AI, pembagian data harus dilakukan pada tingkat subjek/pasien agar data dari orang yang sama tidak bocor antara data pelatihan dan pengujian.\\n\\n---\\n\\n## G. Satu hal penting sebelum proposal disusun\\n\\nPedoman PKM 2026 mendefinisikan PKM-KC sebagai kegiatan menghasilkan karya baru yang fungsional dan tidak sekadar meniru produk yang telah ada. Luaran wajibnya mencakup prototype atau produk fungsional, laporan kemajuan, laporan akhir, dan akun media sosial. \u003cCite refs={[\\\"turn950386search33\\\",\\\"turn950386search34\\\"]}/\u003e\\n\\nKarena itu, saya menyarankan tim memilih satu masalah kesehatan, kemudian melakukan studi pembanding produk dan penelitian terdahulu sebelum menetapkan klaim novelty.\\n\\n**Pilihan saya: PULMO-SCAN atau NEUROSTEP.** Keduanya memberikan ruang yang cukup besar untuk menunjukkan identitas keilmuan Sistem Telekomunikasi.\\n\\nKalau saya bertindak sebagai dosen pembimbing, saya akan mengarahkan mahasiswa membuat satu alat yang benar-benar bekerja, memiliki kebaruan yang terukur, dan bisa didemonstrasikan di hadapan reviewer, daripada membuat sistem yang terlalu luas tetapi tidak selesai.\\n\\n\",{\"_1035\":1036},\"real_author\",\"tool:web\",{\"_152\":902,\"_159\":1040,\"_54\":1041,\"_56\":1042,\"_163\":1043,\"_165\":166,\"_167\":34,\"_168\":169,\"_170\":1044,\"_172\":173,\"_174\":175},\"183a1be7-aa2e-4913-8b2f-3de99bf50c69\",[876],{\"_860\":861,\"_170\":2079},1795413931.253409,1795413959.682259,{\"_855\":856,\"_857\":2077},{\"_1045\":34,\"_1046\":1047,\"_1048\":876,\"_1 63,\"_1964\":1965,\"_1966\":1967,\"_1968\":1969,\"_1970\":1971,\"_1972\":1973,\"_1974\":1975,\"_1976\":1977,\"_1978\":1979,\"_1980\":1981,\"_1982\":1983,\"_1984\":1343,\"_1985\":1986,\"_1987\":1988,\"_1989\":1369,\"_1990\":1137,\"_1991\":766,\"_1992\":1993,\"_1994\":1995,\"_1996\":1997,\"_1998\":1999,\"_2000\":2001,\"_2002\":2003,\"_2004\":2005,\"_2006\":2007,\"_2008\":2009,\"_2010\":2011,\"_2012\":2013,\"_2014\":2015,\"_2016\":2017,\"_2018\":2019,\"_2020\":2021,\"_2022\":2023,\"_2024\":2025,\"_2026\":2027,\"_2028\":2029,\"_2030\":2031,\"_2032\":2033,\"_2034\":2035,\"_2036\":2037,\"_2038\":2039,\"_2040\":2041,\"_2042\":2043,\"_2044\":2045,\"_2046\":2047,\"_2048\":2049,\"_2050\":2051,\"_2052\":2053,\"_2054\":2055,\"_2056\":2057,\"_2058\":2059,\"_2060\":2061,\"_2062\":2063,\"_2064\":2065,\"_2066\":1117,\"_2067\":2068,\"_2069\":2070,\"_2071\":2072,\"_2073\":2074},\"# 10 Alternatif Judul PKM-KC Bidang Kesehatan dan Telekomunikasi\\n\\n**Tema besar: Inovasi perangkat deteksi dini penyakit berbasis sensor, pengolahan sinyal digital, IoT, dan kecerdasan buatan.**\\n\\nUntuk skema PKM-KC, saya menyarankan agar mahasiswa tidak sekadar membuat aplikasi kesehatan, tetapi menghasilkan **prototype alat yang memiliki fungsi nyata, keunggulan teknologi, dan dapat diuji secara kuantitatif**\\\\.\\n\\nInspirasi dari karya-karya berprestasi PIMNAS 2025 dapat diterapkan melalui tiga pendekatan\\\\:\\n\\n1. Mengembangkan alat kesehatan yang menjawab permasalahan nyata.\\n2. Mengintegrasikan beberapa teknologi menjadi satu sistem yang memiliki fungsi baru.\\n3. Membuktikan manfaat inovasi melalui pengujian prototype, bukan hanya simulasi atau desain konseptual.\\n\\nSepuluh alternatif berikut dirancang agar tetap berakar pada kompetensi Sistem Telekomunikasi, khususnya elektronika, sensor, komunikasi nirkabel, pengolahan sinyal, dan AI.\\n\\n## A. Sepuluh alternatif judul dan rancangan inovasi\\n\\n### 1\\\\. PULMO-SCAN\\n\\n**Portable Respiratory Acoustic Analyzer Berbasis Multi-Sensor dan Edge AI untuk Skrining Awal Gangguan Fungsi Pernapasan**\\n\\n(Rekomendasi utama) (PKM-KC)\\n\\nimage_group{\\\"query\\\":[\\\"portable respiratory lung sound digital stethoscope medical device prototype electronics\\\"],\\\"aspect_ratio\\\":\\\"16:9\\\",\\\"layout\\\":\\\"carousel\\\",\\\"num_per_query\\\":1}\\n\\n**Latar belakang**\\n\\nGangguan pernapasan seperti asma dan penyakit paru obstruktif kronis (PPOK) membutuhkan pemeriksaan untuk mengetahui kondisi fungsi pernapasan. Pemeriksaan konvensional memerlukan tenaga kesehatan dan perangkat khusus. Di sisi lain, suara napas mengandung informasi akustik yang dapat dianalisis untuk membantu skrining awal.\\n\\n**Kebaruan (novelty)**\\n\\n- Menggabungkan mikrofon kontak atau sensor suara dengan sensor aliran udara.\\n- Memproses karakteristik suara inspirasi dan ekspirasi.\\n- Menggunakan Edge AI untuk mengklasifikasikan pola suara napas.\\n- Hasil analisis dapat ditampilkan langsung tanpa ketergantungan koneksi internet.\\n\\n**Metode pengembangan**\\n\\n1. Merancang perangkat akuisisi suara pernapasan.\\n2. Mengintegrasikan mikrofon kontak, sensor aliran udara, dan mikrokontroler.\\n3. Melakukan filtering, ekstraksi MFCC, dan analisis fitur spektral.\\n4. Mengembangkan model klasifikasi ringan.\\n5. Menguji kualitas akuisisi, waktu pemrosesan, dan performa klasifikasi menggunakan dataset tervalidasi.\\n\\n**Luaran**\\n\\n- Prototype alat perekam dan analisis suara pernapasan.\\n- Dashboard hasil skrining.\\n- Model Edge AI.\\n- Data hasil pengujian performa alat.\\n\\n---\\n\\n### 2\\\\. VASCULAR-SENSE\\n\\n**Wearable Photoplethysmography Multi-Wavelength Berbasis AI untuk Skrining Dini Risiko Gangguan Sirkulasi Perifer pada Penderita Diabetes**\\n\\nimage_group{\\\"query\\\":[\\\"wearable photoplethysmography PPG sensor finger pulse oximeter medical electronics prototype\\\"],\\\"aspect_ratio\\\":\\\"16:9\\\",\\\"layout\\\":\\\"carousel\\\",\\\"num_per_query\\\":1}\\n\\n**Latar belakang**\\n\\nPenderita diabetes memiliki risiko mengalami gangguan sirkulasi perifer yang dapat berujung pada luka kaki diabetik. Pemantauan kondisi sirkulasi secara berkala diperlukan untuk membantu mengidentifikasi perubahan kondisi lebih awal.\\n\\n**Kebaruan**\\n\\n- Menggabungkan sensor PPG dengan beberapa panjang gelombang cahaya.\\n- Menganalisis perubahan bentuk gelombang, amplitudo, dan waktu kedatangan pulsa.\\n- Mengembangkan algoritma untuk mendeteksi pola yang mengindikasikan risiko gangguan perfusi perifer.\\n- Memiliki fitur transmisi data nirkabel untuk pemantauan berkala.\\n\\n**Metode pengembangan**\\n\\n1. Merancang sensor PPG multi-wavelength.\\n2. Mengembangkan rangkaian penguat dan filter sinyal.\\n3. Melakukan ekstraksi fitur sinyal PPG.\\n4. Mengembangkan algoritma klasifikasi atau deteksi anomali.\\n5. Menguji stabilitas sinyal dan membandingkan hasil pengukuran dengan alat referensi serta penilaian tenaga medis.\\n\\n**Luaran**\\n\\n- Prototype wearable sensor PPG.\\n- Sistem analisis sinyal perfusi.\\n- Aplikasi monitoring.\\n- Hasil uji akurasi dan stabilitas pengukuran.\\n\\n---\\n\\n### 3\\\\. NEUROSTEP\\n\\n**Smart Insole Berbasis Pressure Sensor Array dan Inertial Measurement Unit untuk Deteksi Dini Risiko Neuropati Diabetik melalui Analisis Pola Berjalan**\\n\\nimage_group{\\\"query\\\":[\\\"smart insole pressure sensor array gait analysis wearable prototype\\\"],\\\"aspect_ratio\\\":\\\"16:9\\\",\\\"layout\\\":\\\"carousel\\\",\\\"num_per_query\\\":1}\\n\\n**Latar belakang**\\n\\nNeuropati diabetik dapat menyebabkan penurunan sensitivitas kaki dan perubahan pola berjalan. Perubahan distribusi tekanan telapak kaki berpotensi menjadi indikator untuk mengidentifikasi risiko gangguan tersebut.\\n\\n**Kebaruan**\\n\\n- Mengintegrasikan sensor tekanan pada beberapa titik telapak kaki.\\n- Mengombinasikan data tekanan dengan sensor IMU.\\n- Menggunakan algoritma analisis gait untuk mengidentifikasi perubahan pola berjalan.\\n- Mengirimkan hasil pengukuran itoring parameter perifer, bukan mendiagnosis trombosis atau emboli paru.\\n\\n---\\n\\n### 5\\\\. RENAL-WATCH\\n\\n**Portable Bioimpedance Spectroscopy Berbasis IoT untuk Monitoring Perubahan Cairan Tubuh sebagai Sistem Peringatan Dini Risiko Gangguan Keseimbangan Cairan**\\n\\nimage_group{\\\"query\\\":[\\\"portable bioimpedance spectroscopy body composition medical analyzer electrode prototype\\\"],\\\"aspect_ratio\\\":\\\"16:9\\\",\\\"layout\\\":\\\"carousel\\\",\\\"num_per_query\\\":1}\\n\\n**Latar belakang**\\n\\nPerubahan keseimbangan cairan tubuh penting dipantau pada individu dengan risiko gangguan fungsi ginjal dan penyakit kardiovaskular. Pengukuran bioimpedansi dapat digunakan untuk memperkirakan perubahan karakteristik cairan tubuh, meskipun tidak dapat menggantikan pemeriksaan fungsi ginjal.\\n\\n**Kebaruan**\\n\\n- Menggunakan bioimpedance spectroscopy pada beberapa frekuensi.\\n- Mengintegrasikan sensor suhu dan pemantauan kondisi pengukuran.\\n- Menggunakan algoritma untuk mendeteksi perubahan tren impedansi.\\n- Memiliki komunikasi nirkabel untuk mengirimkan data secara berkala.\\n\\n**Metode pengembangan**\\n\\n1. Merancang rangkaian injeksi dan pengukuran impedansi berarus rendah.\\n2. Mengembangkan sistem pengukuran multi-frekuensi.\\n3. Mengintegrasikan mikrokontroler dan modul komunikasi.\\n4. Melakukan kalibrasi terhadap beban referensi.\\n5. Menguji repeatability dan konsistensi hasil pengukuran.\\n\\n**Luaran**\\n\\n- Prototype portable bioimpedance analyzer.\\n- Dashboard monitoring perubahan impedansi.\\n- Algoritma analisis tren data.\\n\\n---\\n\\n### 6\\\\. RETINA-LINK\\n\\n**Portable Retinal Image Acquisition Berbasis Smartphone dan Edge AI untuk Skrining Awal Risiko Retinopati Diabetik**\\n\\nimage_group{\\\"query\\\":[\\\"portable smartphone retinal fundus camera ophthalmology imaging attachment prototype\\\"],\\\"aspect_ratio\\\":\\\"16:9\\\",\\\"layout\\\":\\\"carousel\\\",\\\"num_per_query\\\":1}\\n\\n**Latar belakang**\\n\\nRetinopati diabetik merupakan salah satu komplikasi diabetes yang dapat mengakibatkan gangguan penglihatan. Pemeriksaan retina memerlukan alat khusus dan tidak selalu mudah dijangkau masyarakat.\\n\\n**Kebaruan**\\n\\n- Mengembangkan modul akuisisi citra retina portabel.\\n- Mengoptimalkan pencahayaan dan fokus melalui sistem elektronika.\\n- Menggunakan Edge AI untuk analisis citra retina.\\n- Memungkinkan penyimpanan dan transmisi hasil pemeriksaan melalui jaringan nirkabel.\\n\\n**Metode pengembangan**\\n\\n1. Merancang modul optik dan pencahayaan.\\n2. Mengembangkan sistem pengambilan citra retina.\\n3. Melakukan preprocessing citra.\\n4. Mengembangkan CNN untuk skrining citra.\\n5. Menguji kualitas citra, sensitivitas, spesifisitas, dan waktu pemrosesan.\\n\\n**Luaran**\\n\\n- Prototype retinal image acquisition.\\n- Model AI untuk skrining.\\n- Aplikasi penyimpanan hasil pemeriksaan.\\n\\nCatatan: perlu tenaga ahli mata untuk validasi citra dan pengujian. Jangan mengklaim diagnosis otomatis tanpa validasi klinis.\\n\\n---\\n\\n### 7\\\\. CARDIO-VOICE\\n\\n**Sistem Skrining Risiko Gangguan Jantung Berbasis Analisis Fonokardiogram Digital dan Edge AI dengan Komunikasi Nirkabel**\\n\\nimage_group{\\\"query\\\":[\\\"digital electronic stethoscope phonocardiogram heart sound sensor prototype\\\"],\\\"aspect_ratio\\\":\\\"16:9\\\",\\\"layout\\\":\\\"carousel\\\",\\\"num_per_query\\\":1}\\n\\n**Latar belakang**\\n\\nBunyi jantung mengandung informasi akustik mengenai aktivitas mekanis jantung. Perubahan karakteristik bunyi jantung dapat berkaitan dengan kondisi abnormal, sehingga analisis fonokardiogram (PCG) berpotensi membantu skrining awal.\\n\\n**Kebaruan**\\n\\n- Mengembangkan stetoskop digital berbasis sensor akustik kontak.\\n- Menggabungkan analisis PCG dan fitur denyut jantung.\\n- Menerapkan noise cancellation untuk mengurangi gangguan suara lingkungan.\\n- Menggunakan Edge AI untuk klasifikasi pola bunyi jantung.\\n\\n**Metode pengembangan**\\n\\n1. Mengembangkan rangkaian sensor akustik.\\n2. Mengimplementasikan filter digital untuk menghilangkan noise.\\n3. Melakukan segmentasi siklus bunyi jantung.\\n4. Mengekstraksi fitur MFCC dan spektral.\\n5. Mengembangkan model klasifikasi.\\n6. Menguji performa dengan dataset PCG tervalidasi.\\n\\n**Luaran**\\n\\n- Prototype stetoskop digital.\\n- Sistem analisis PCG.\\n- Model Edge AI.\\n- Aplikasi monitoring hasil skrining.\\n\\n---\\n\\n### 8\\\\. STROKE-MON\\n\\n**Wearable Neuro-Motor Sensor Berbasis IMU dan Surface EMG dengan Edge AI untuk Deteksi Dini Asimetri Gerak sebagai Indikator Risiko Stroke**\\n\\nimage_group{\\\"query\\\":[\\\"wearable surface EMG sensor armband IMU rehabilitation electronics prototype\\\"],\\\"aspect_ratio\\\":\\\"16:9\\\",\\\"layout\\\":\\\"carousel\\\",\\\"num_per_query\\\":1}\\n\\n**Latar belakang**\\n\\nAsimetri gerak dan perubahan aktivitas otot dapat ditemukan pada individu dengan gangguan neuromotor. Pemantauan gerakan tubuh secara objektif dapat membantu mengidentifikasi perubahan fungsi motorik.\\n\\n**Kebaruan**\\n\\n- Menggabungkan sensor IMU dan surface EMG.\\n- Mengukur perbedaan aktivitas otot dan pola gerak kanan-kiri.\\n- Mengembangkan algoritma pengenalan asimetri gerak.\\n- Menggunakan komunikasi nirkabel untuk mengirimkan hasil pengukuran.\\n\\n**Metode pengembangan**\\n\\n1. Merancang wearable sensor IMU dan EMG.\\n2. Mengembangkan akuisisi sinyal secara simultan.\\n3. Melakukan filtering dan normalisasi sinyal.\\n4. Mengekstraksi fitur aktivitas otot dan gerakan.\\n5. Mengembangkan algoritma klasifikasi asimetri.\\n6. Menguji prototype dengan protokol gerakan terstandar.\\n\\n**Luaran**\\n\\n- Prototype wearable neuro-motor.\\n- Algoritma analisis asimetri gerak.\\n- Aplikasi monitoring.\\n\\nCatatan: alat ini lebih tepat disebut sistem pemantauan asimetri motorik, bukan alat diagnosis atau prediksi stroke.\\n\\n---\\n\\n### 9\\\\. OXYSENSE\\n\\n**Portable Multi-Wavelength PPG dan Respiratory Sensor dengan Adaptive Signal Processing untuk Skrining Dini Risiko Hipoksemia**\\n\\nimage_group{\\\"query\\\":[\\\"portable pulse oximeter respiratory monitoring medical wearable sensor device\\\"],\\\"aspect_ratio\\\":\\\"16:9\\\",\\\"layout\\\":\\\"carousel\\\",\\\"num_per_query\\\":1}\\n\\n**Latar belakang**\\n\\nHipoksemia merupakan kondisi rendahnya kadar oksigen dalam darah yang dapat berkaitan dengan berbagai gangguan kesehatan. Pemantauan saturasi oksigen dan pola pernapasan dapat membantu mengenali perubahan kondisi fisiologis lebih awal.\\n\\n**Kebaruan**\\n\\n- Menggabungkan multi-wavelength PPG dengan sensor respirasi.\\n- Menerapkan adaptive filtering untuk mengurangi artefak gerakan.\\n- Mengembangkan algoritma pendeteksian kualitas sinyal sebelum menghitung parameter.\\n- Mengirimkan informasi hasil pengukuran melalui Bluetooth atau Wi-Fi.\\n\\n**Metode pengembangan**\\n\\n1. Merancang sensor PPG multi-wavelength.\\n2. Mengintegrasikan sensor respirasi.\\n3. Mengembangkan algoritma adaptive filtering.\\n4. Menghitung SpO2 dan parameter respirasi.\\n5. Menguji hasil pengukuran terhadap alat referensi yang tervalidasi.\\n6. Mengukur akurasi, latency, dan konsumsi daya.\\n\\n**Luaran**\\n\\n- Prototype portable oxygen monitoring.\\n- Algoritma adaptive signal processing.\\n- Dashboard monitoring dan notifikasi.\\n\\n---\\n\\n### 10\\\\. ORAL-SCAN\\n\\n**Portable Oral Lesion Screening Berbasis Multispectral LED Imaging dan Edge AI untuk Identifikasi Awal Kelainan Mukosa Mulut**\\n\\nimage_group{\\\"query\\\":[\\\"portable oral examination camera multispectral LED imaging medical device prototype\\\"],\\\"aspect_ratio\\\":\\\"16:9\\\",\\\"layout\\\":\\\"carousel\\\",\\\"num_per_query\\\":1}\\n\\n**Latar belakang**\\n\\nKelainan mukosa mulut dapat berkembang menjadi kondisi yang lebih serius apabila tidak teridentifikasi dan diperiksa lebih lanjut. Pemeriksaan visual awal dapat dibantu dengan teknologi pencitraan portabel.\\n\\n**Kebaruan**\\n\\n- Mengintegrasikan kamera makro dan pencahayaan LED multispektral.\\n- Mengambil citra dengan beberapa kondisi pencahayaan.\\n- Menggunakan analisis tekstur dan warna untuk mengidentifikasi pola kelainan.\\n- Mengimplementasikan Edge AI untuk analisis citra secara langsung.\\n\\n**Metode pengembangan**\\n\\n1. Merancang perangkat kamera makro.\\n2. Mengintegrasikan beberapa kanal LED.\\n3. Mengembangkan sistem akuisisi citra terstandar.\\n4. Melakukan preprocessing dan ekstraksi fitur.\\n5. Mengembangkan CNN untuk klasifikasi citra.\\n6. Melakukan validasi dengan dataset dan penilaian tenaga medis.\\n\\n**Luaran**\\n\\n- Prototype portable oral scanner.\\n- Model AI untuk skrining citra.\\n- Aplikasi visualisasi hasil pemeriksaan.\\n\\nCatatan: sistem tidak menggantikan pemeriksaan dokter gigi atau biopsi untuk penegakan diagnosis.\\n\\n---\\n\\n## B. Perbandingan dan pemeringkatan potensi judul\\n\\nUntuk menentukan mana yang paling layak dikembangkan, berikut perbandingan berdasarkan aspek kebaruan, keterkaitan dengan Telekomunikasi, dan kemudahan pembuatan prototype.\\n\\n| No. | Judul | Kebaruan teknologi | Kesesuaian Telekomunikasi | Kompleksitas |\\n|--------|--------|--------|--------|--------|\\n| 1 | PULMO-SCAN | Tinggi | Sangat tinggi | Sedang |\\n| 2 | VASCULAR-SENSE | Tinggi | Sangat tinggi | Tinggi |\\n| 3 | NEUROSTEP | Tinggi | Sangat tinggi | Sedang |\\n| 4 | THROMBO-ALERT | Tinggi | Sangat tinggi | Tinggi |\\n| 5 | RENAL-WATCH | Tinggi | Sangat tinggi | Tinggi |\\n| 6 | RETINA-LINK | Sedang–tinggi | Tinggi | Tinggi |\\n| 7 | CARDIO-VOICE | Tinggi | Sangat tinggi | Sedang |\\n| 8 | STROKE-MON | Tinggi | Sangat tinggi | Tinggi |\\n| 9 | OXYSENSE | Sedang–tinggi | Sangat tinggi | Sedang |\\n| 10 | ORAL-SCAN | Tinggi | Tinggi | Tinggi |\\n\\n*Penilaian tersebut merupakan pertimbangan awal konseptual, bukan hasil pengukuran novelty atau penilaian resmi reviewer.*\\n\\n## C. Tiga judul yang paling saya rekomendasikan\\n\\n**1\\\\. PULMO-SCAN** (Pilihan pertama)\\n\\nimage_group{\\\"query\\\":[\\\"portable digital respiratory sound analyzer medical electronic stethoscope prototype\\\"],\\\"aspect_ratio\\\":\\\"16:9\\\",\\\"layout\\\":\\\"carousel\\\",\\\"num_per_query\\\":1}\\n\\n**Alasan\\\\:**\\n\\n- Mengangkat masalah kesehatan yang relevan.\\n- Sangat sesuai dengan keahlian pengolahan sinyal digital.\\n- Dapat menggabungkan elektronika, sensor, AI, dan IoT.\\n- Memiliki potensi menghasilkan prototype yang bisa didemonstrasikan.\\n\\n**Keunggulan presentasi\\\\:** mahasiswa dapat memperlihatkan proses perekaman suara napas, pemrosesan sinyal, hingga hasil analisis secara langsung.\\n\\n---\\n\\n**2\\\\. NEUROSTEP** (Pilihan kedua)\\n\\nimage_group{\\\"query\\\":[\\\"smart pressure sensing insole gait analysis prototype electronics\\\"],\\\"aspect_ratio\\\":\\\"16:9\\\",\\\"layout\\\":\\\"carousel\\\",\\\"num_per_query\\\":1}\\n\\n**Alasan\\\\:**\\n\\n- Bentuk produknya konkret dan mudah dipahami reviewer.\\n- Integrasi sensor tekanan dan IMU memperlihatkan kompetensi elektronika telekomunikasi.\\n- Data dapat ditampilkan secara visual dalam bentuk heatmap tekanan kaki.\\n- Memiliki peluang pengembangan untuk monitoring pasien diabetes.\\n\\n**Keunggulan presentasi\\\\:** reviewer dapat melihat langsung perubahan distribusi tekanan ketika seseorang berjalan.\\n\\n---\\n\\n**3\\\\. CARDIO-VOICE** (Alternatif ketiga)\\n\\nimage_group{\\\"query\\\":[\\\"electronic digital phonocardiogram stethoscope prototype heart sound analyzer\\\"],\\\"aspect_ratio\\\":\\\"16:9\\\",\\\"layout\\\":\\\"carousel\\\",\\\"num_per_query\\\":1}\\n\\n**Alasan\\\\:**\\n\\n- Sangat relevan dengan pengolahan sinyal digital.\\n- Memiliki tantangan teknis yang jelas, seperti filtering, segmentasi, dan klasifikasi sinyal.\\n- Dapat dikembangkan dengan komponen yang relatif terjangkau.\\n- Demonstrasi prototype relatif menarik.\\n\\n**Keunggulan presentasi\\\\:** menampilkan perbedaan karakteristik sinyal bunyi jantung dan hasil pemrosesan digital.\\n\\n## D. Belajar dari pemenang PIMNAS 2025\\n\\nAda tiga karya PKM-KC bidang kesehatan yang menurut saya sangat relevan untuk dipelajari\\\\:\\n\\n| Karya | Prestasi PIMNAS 38 | Pelajaran untuk proposal baru |\\n|--------|--------|--------|\\n| Sistem peringatan dini TB melalui suara batuk (ITS) | Emas KC-1 | Penggunaan sinyal akustik untuk skrining kesehatan |\\n| Cardioguard (UGM) | Perak KC-1 | Integrasi wearable, AI, IoT, dan perangkat keras |\\n| Orside (UGM) | Emas KC-2 | Integrasi teknologi sensor optik dan deep learning |\\n\\nSumber daftar pemenang: urlSK Pemenang PIMNAS 2025https://simbelmawa.kemdiktisaintek.go.id/portal/wp-content/uploads/2026/11/SK-Pemenang-PIMNAS-2025-Rev-1.pdf\\\\. Informasi Cardioguard juga dijelaskan oleh urlDepartemen Teknik Elektro dan Teknologi Informasi UGMturn950386search4\\\\.\\n\\nHal yang perlu diperhatikan: jangan membuat proposal yang hanya mengganti nama perangkat atau mengganti algoritma dari karya pemenang. Misalnya, membuat ulang alat deteksi TB dengan suara batuk dan CNN saja belum menunjukkan kebaruan yang kuat.\\n\\nKita perlu memiliki pembeda pada mekanisme pengukuran, kombinasi sensor, metode pengolahan, atau fungsi perangkat.\\n\\n## E. Rekomendasi arsitektur teknologi\\n\\nAgar mahasiswa memiliki gambaran implementasi, berikut arsitektur umum yang bisa digunakan untuk ketiga judul unggulan.\\n\\n**Arsitektur prototype HealthTech berbasis Telekomunikasi**\\n\\n**Sensor Akuisisi Kesehatan**\\n\\nPPG / Mikrofon / IMU / Pressure Sensor / EMG\\n\\n**Embedded System**\\n\\nESP32 / STM32 / Raspberry Pi\\n\\n**Digital Signal Processing**\\n\\nFiltering – Noise Reduction – Feature Extraction\\n\\n**Artificial Intelligence / Edge AI**\\n\\nKlasifikasi – Deteksi Anomali – Analisis Risiko\\n\\n**Wireless Communication**\\n\\nBluetooth / Wi-Fi / LoRa\\n\\n**Dashboard dan Sistem Peringatan**\\n\\nVisualisasi hasil – Riwayat pengukuran – Notifikasi\\n\\n## F. Parameter keberhasilan prototype\\n\\nSaya menyarankan mahasiswa tidak hanya menguji apakah alat dapat menyala, tetapi juga melakukan pengujian teknis yang terukur.\\n\\n| Aspek pengujian | Parameter |\\n|--------|--------|\\n| Sensor | Akurasi, sensitivitas, repeatability |\\n| Pengolahan sinyal | SNR, noise reduction, kualitas sinyal |\\n| AI | Accuracy, precision, recall, F1-score, sensitivity, specificity |\\n| Telekomunikasi | Latency, packet loss, jangkauan komunikasi |\\n| Perangkat | Konsumsi daya, waktu operasi, kestabilan |\\n| Sistem | Keberhasilan integrasi seluruh modul |\\n\\nUntuk pengujian AI, pembagian data harus dilakukan pada tingkat subjek/pasien agar data dari orang yang sama tidak bocor antara data pelatihan dan pengujian.\\n\\n---\\n\\n## G. Satu hal penting sebelum proposal disusun\\n\\nPedoman PKM 2026 mendefinisikan PKM-KC sebagai kegiatan menghasilkan karya baru yang fungsional dan tidak sekadar meniru produk yang telah ada. Luaran wajibnya mencakup prototype atau produk fungsional, laporan kemajuan, laporan akhir, dan akun media sosial. citeturn950386search33turn950386search34\\n\\nKarena itu, saya menyarankan tim memilih satu masalah kesehatan, kemudian melakukan studi pembanding produk dan penelitian terdahulu sebelum menetapkan klaim novelty.\\n\\n**Pilihan saya: PULMO-SCAN atau NEUROSTEP.** Keduanya memberikan ruang yang cukup besar untuk menunjukkan identitas keilmuan Sistem Telekomunikasi.\\n\\nKalau saya bertindak sebagai dosen pembimbing, saya akan mengarahkan mahasiswa membuat satu alat yang benar-benar bekerja, memiliki kebaruan yang terukur, dan bisa didemonstrasikan di hadapan reviewer, daripada membuat sistem yang terlalu luas tetapi tidak selesai.\",[371,1349,1368],{\"_349\":1327},{\"_351\":1328,\"_353\":354,\"_355\":1329},{\"_330\":1330,\"_319\":1331,\"_308\":1332,\"_297\":1333,\"_286\":1334,\"_275\":1335,\"_264\":1336,\"_249\":1337,\"_1203\":1338,\"_1189\":1339,\"_1177\":1340,\"_1163\":1341,\"_1149\":1342,\"_1343\":1344,\"_1137\":1345,\"_1117\":1346},{},{\"_165\":365,\"_366\":1564,\"_62\":1
