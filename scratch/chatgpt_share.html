7\":1314,\"_388\":1313,\"_389\":1569,\"_391\":392,\"_53\":1570,\"_394\":1571,\"_396\":34,\"_397\":1572,\"_399\":1573,\"_401\":1574,\"_403\":14},\"https://innovex.computex.biz/2020/_uploads/202005261637012115.jpg\",\"Heroic-Faith - Change the game of respiratory monitoring system!\",\"portable respiratory lung sound digital stethoscope medical device prototype electronics\",{\"_43\":1577,\"_45\":1578},{\"_43\":1577,\"_45\":1578},{\"_404\":1575,\"_406\":1576},0.3450520833333333,0.2152777777777778,768,432,\"10 Alternatif Judul PKM-KC Bidang Kesehatan dan Telekomunikasi\",\"Tema besar: Inovasi perangkat deteksi dini penyakit berbasis sensor, pengolahan sinyal digital, IoT, dan kecerdasan buatan.\",\"Untuk skema PKM-KC, saya menyarankan agar mahasiswa tidak sekadar membuat aplikasi kesehatan, tetapi menghasilkan \",\"prototype alat yang memiliki fungsi nyata, keunggulan teknologi, dan dapat diuji secara kuantitatif\",\"Inspirasi dari karya-karya berprestasi PIMNAS 2025 dapat diterapkan melalui tiga pendekatan:\",\"Mengembangkan alat kesehatan yang menjawab permasalahan nyata.\",\"Mengintegrasikan beberapa teknologi menjadi satu sistem yang memiliki fungsi baru.\",\"Membuktikan manfaat inovasi melalui pengujian prototype, bukan hanya simulasi atau desain konseptual.\",\"Sepuluh alternatif berikut dirancang agar tetap berakar pada kompetensi Sistem Telekomunikasi, khususnya elektronika, sensor, komunikasi nirkabel, pengolahan sinyal, dan AI.\",\"A. Sepuluh alternatif judul dan rancangan inovasi\",\"1. PULMO-SCAN\",\"Portable Respiratory Acoustic Analyzer Berbasis Multi-Sensor dan Edge AI untuk Skrining Awal Gangguan Fungsi Pernapasan\",\"Rekomendasi utama\",\"PKM-KC\",\"Latar belakang\",\"Gangguan pernapasan seperti asma dan penyakit paru obstruktif kronis (PPOK) membutuhkan pemeriksaan untuk mengetahui kondisi fungsi pernapasan. Pemeriksaan konvensional memerlukan tenaga kesehatan dan perangkat khusus. Di sisi lain, suara napas mengandung informasi akustik yang dapat dianalisis untuk membantu skrining awal.\",\"Kebaruan (novelty)\",\"Menggabungkan mikrofon kontak atau sensor suara dengan sensor aliran udara.\",\"Memproses karakteristik suara inspirasi dan ekspirasi.\",\"Menggunakan Edge AI untuk mengklasifikasikan pola suara napas.\",\"Hasil analisis dapat ditampilkan langsung tanpa ketergantungan koneksi internet.\",\"Metode pengembangan\",\"Merancang perangkat akuisisi suara pernapasan.\",\"Mengintegrasikan mikrofon kontak, sensor aliran udara, dan mikrokontroler.\",\"Melakukan filtering, ekstraksi MFCC, dan analisis fitur spektral.\",\"Mengembangkan model klasifikasi ringan.\",\"Menguji kualitas akuisisi, waktu pemrosesan, dan performa klasifikasi menggunakan dataset tervalidasi.\",\"Luaran\",\"Prototype alat perekam dan analisis suara pernapasan.\",\"Dashboard hasil skrining.\",\"Model Edge AI.\",\"Data hasil pengujian performa alat.\",\"2. VASCULAR-SENSE\",\"Wearable Photoplethysmography Multi-Wavelength Berbasis AI untuk Skrining Dini Risiko Gangguan Sirkulasi Perifer pada Penderita Diabetes\",\"Penderita diabetes memiliki risiko mengalami gangguan sirkulasi perifer yang dapat berujung pada luka kaki diabetik. Pemantauan kondisi sirkulasi secara berkala diperlukan untuk membantu mengidentifikasi perubahan kondisi lebih awal.\",\"Kebaruan\",\"Menggabungkan sensor PPG dengan beberapa panjang gelombang cahaya.\",\"Menganalisis perubahan bentuk gelombang, amplitudo, dan waktu kedatangan pulsa.\",\"Mengembangkan algoritma untuk mendeteksi pola yang mengindikasikan risiko gangguan perfusi perifer.\",\"Memiliki fitur transmisi data nirkabel untuk pemantauan berkala.\",\"Merancang sensor PPG multi-wavelength.\",\"Mengembangkan rangkaian penguat dan filter sinyal.\",\"Melakukan ekstraksi fitur sinyal PPG.\",\"Mengembangkan algoritma klasifikasi atau deteksi anomali.\",\"Menguji stabilitas sinyal dan membandingkan hasil pengukuran dengan alat referensi serta penilaian tenaga medis.\",\"Prototype wearable sensor PPG.\",\"Sistem analisis sinyal perfusi.\",\"Aplikasi monitoring.\",\"Hasil uji akurasi dan stabilitas pengukuran.\",\"3. NEUROSTEP\",\"Smart Insole Berbasis Pressure Sensor Array dan Inertial Measurement Unit untuk Deteksi Dini Risiko Neuropati Diabetik melalui Analisis Pola Berjalan\",\"Neuropati diabetik dapat menyebabkan penurunan sensitivitas kaki dan perubahan pola berjalan. Perubahan distribusi tekanan telapak kaki berpotensi menjadi indikator untuk mengidentifikasi risiko gangguan tersebut.\",\"Mengintegrasikan sensor tekanan pada beberapa titik telapak kaki.\",\"Mengombinasikan data tekanan dengan sensor IMU.\",\"Menggunakan algoritma analisis gait untuk mengidentifikasi perubahan pola berjalan.\",\"Mengirimkan hasil pengukuran secara nirkabel.\",\"Merancang insole dengan pressure sensor array.\",\"Mengintegrasikan IMU dan mikrokontroler.\",\"Mengembangkan sistem akuisisi data.\",\"Melakukan filtering dan ekstraksi fitur gait.\",\"Mengembangkan algoritma klasifikasi pola berjalan.\",\"Menguji akurasi pengukuran tekanan dan konsistensi klasifikasi.\",\"Prototype smart insole.\",\"Aplikasi visualisasi distribusi tekanan.\",\"Algoritma analisis gait.\",\"Laporan pengujian prototype.\",\"4. THROMBO-ALERT\",\"Sistem Wearable Multi-Sensor Berbasis Bioimpedance dan Photoplethysmography untuk Monitoring Perubahan Hemodinamik Perifer secara Real-Time\",\"Perubahan kondisi aliran darah perifer dapat berkaitan dengan berbagai gangguan vaskular. Dibutuhkan perangkat yang dapat mengamati perubahan parameter fisiologis secara kontinu dan memberikan informasi ketika ditemukan pola yang tidak biasa.\",\"Menggabungkan pengukuran bioimpedansi dan PPG.\",\"Menganalisis perubahan impedansi jaringan dan karakteristik pulsa darah.\",\"Mengembangkan sistem sensor fusion untuk mengurangi kesalahan akibat pembacaan satu sensor.\",\"Memberikan peringatan ketika ditemukan perubahan parameter yang melewati batas pengujian.\",\"Merancang rangkaian bioimpedansi frekuensi rendah yang aman.\",\"Mengintegrasikan sensor PPG.\",\"Melakukan akuisisi dan sinkronisasi kedua sinyal.\",\"Mengembangkan algoritma sensor fusion.\",\"Menguji repeatability, sensitivitas, dan respons sistem.\",\"Prototype wearable multi-sensor.\",\"Algoritma pengolahan sinyal.\",\"Sistem notifikasi perubahan parameter.\",\"Catatan: prototype ini diarahkan untuk monitoring parameter perifer, bukan mendiagnosis trombosis atau emboli paru.\",\"5. RENAL-WATCH\",\"Portable Bioimpedance Spectroscopy Berbasis IoT untuk Monitoring Perubahan Cairan Tubuh sebagai Sistem Peringatan Dini Risiko Gangguan Keseimbangan Cairan\",\"Perubahan keseimbangan cairan tubuh penting dipantau pada individu dengan risiko gangguan fungsi ginjal dan penyakit kardiovaskular. Pengukuran bioimpedansi dapat digunakan untuk memperkirakan perubahan karakteristik cairan tubuh, meskipun tidak dapat menggantikan pemeriksaan fungsi ginjal.\",\"Menggunakan bioimpedance spectroscopy pada beberapa frekuensi.\",\"Mengintegrasikan sensor suhu dan pemantauan kondisi pengukuran.\",\"Menggunakan algoritma untuk mendeteksi perubahan tren impedansi.\",\"Memiliki komunikasi nirkabel untuk mengirimkan data secara berkala.\",\"Merancang rangkaian injeksi dan pengukuran impedansi berarus rendah.\",\"Mengembangkan sistem pengukuran multi-frekuensi.\",\"Mengintegrasikan mikrokontroler dan modul komunikasi.\",\"Melakukan kalibrasi terhadap beban referensi.\",\"Menguji repeatability dan konsistensi hasil pengukuran.\",\"Prototype portable bioimpedance analyzer.\",\"Dashboard monitoring perubahan impedansi.\",\"Algoritma analisis tren data.\",\"6. RETINA-LINK\",\"Portable Retinal Image Acquisition Berbasis Smartphone dan Edge AI untuk Skrining Awal Risiko Retinopati Diabetik\",\"Retinopati diabetik merupakan salah satu komplikasi diabetes yang dapat mengakibatkan gangguan penglihatan. Pemeriksaan retina memerlukan alat khusus dan tidak selalu mudah dijangkau masyarakat.\",\"Mengembangkan modul akuisisi citra retina portabel.\",\"Mengoptimalkan pencahayaan dan fokus melalui sistem elektronika.\",\"Menggunakan Edge AI untuk analisis citra retina.\",\"Memungkinkan penyimpanan dan transmisi hasil pemeriksaan melalui jaringan nirkabel.\",\"Merancang modul optik dan pencahayaan.\",\"Mengembangkan sistem pengambilan citra retina.\",\"Melakukan preprocessing citra.\",\"Mengembangkan CNN untuk skrining citra.\",\"Menguji kualitas citra, sensitivitas, spesifisitas, dan waktu pemrosesan.\",\"Prototype retinal image acquisition.\",\"Model AI untuk skrining.\",\"Aplikasi penyimpanan hasil pemeriksaan.\",\"Catatan: perlu tenaga ahli mata untuk validasi citra dan pengujian. Jangan mengklaim diagnosis otomatis tanpa validasi klinis.\",\"7. CARDIO-VOICE\",\"Sistem Skrining Risiko Gangguan Jantung Berbasis Analisis Fonokardiogram Digital dan Edge AI dengan Komunikasi Nirkabel\",\"Bunyi jantung mengandung informasi akustik mengenai aktivitas mekanis jantung. Perubahan karakteristik bunyi jantung dapat berkaitan dengan kondisi abnormal, sehingga analisis fonokardiogram (PCG) berpotensi membantu skrining awal.\",\"Mengembangkan stetoskop digital berbasis sensor akustik kontak.\",\"Menggabungkan analisis PCG dan fitur denyut jantung.\",\"Menerapkan noise cancellation untuk mengurangi gangguan suara lingkungan.\",\"Menggunakan Edge AI untuk klasifikasi pola bunyi jantung.\",\"Mengembangkan rangkaian sensor akustik.\",\"Mengimplementasikan filter digital untuk menghilangkan noise.\",\"Melakukan segmentasi siklus bunyi jantung.\",\"Mengekstraksi fitur MFCC dan spektral.\",\"Mengembangkan model klasifikasi.\",\"Menguji performa dengan dataset PCG tervalidasi.\",\"Prototype stetoskop digital.\",\"Sistem analisis PCG.\",\"160\",\"161\",\"Aplikasi monitoring hasil skrining.\",\"162\",\"8. STROKE-MON\",\"163\",\"Wearable Neuro-Motor Sensor Berbasis IMU dan Surface EMG dengan Edge AI untuk Deteksi Dini Asimetri Gerak sebagai Indikator Risiko Stroke\",\"164\",\"165\",\"166\",\"Asimetri gerak dan perubahan aktivitas otot dapat ditemukan pada individu dengan gangguan neuromotor. Pemantauan gerakan tubuh secara objektif dapat membantu mengidentifikasi perubahan fungsi motorik.\",\"167\",\"168\",\"Menggabungkan sensor IMU dan surface EMG.\",\"169\",\"Mengukur perbedaan aktivitas otot dan pola gerak kanan-kiri.\",\"170\",\"Mengembangkan algoritma pengenalan asimetri gerak.\",\"171\",\"Menggunakan komunikasi nirkabel untuk mengirimkan hasil pengukuran.\",\"172\",\"173\",\"Merancang wearable sensor IMU dan EMG.\",\"174\",\"Mengembangkan akuisisi sinyal secara simultan.\",\"175\",\"Melakukan filtering dan normalisasi sinyal.\",\"176\",\"Mengekstraksi fitur aktivitas otot dan gerakan.\",\"177\",\"Mengembangkan algoritma klasifikasi asimetri.\",\"178\",\"Menguji prototype dengan protokol gerakan terstandar.\",\"179\",\"180\",\"Prototype wearable neuro-motor.\",\"181\",\"Algoritma analisis asimetri gerak.\",\"182\",\"183\",\"Catatan: alat ini lebih tepat disebut sistem pemantauan asimetri motorik, bukan alat diagnosis atau prediksi stroke.\",\"184\",\"9. OXYSENSE\",\"185\",\"Portable Multi-Wavelength PPG dan Respiratory Sensor dengan Adaptive Signal Processing untuk Skrining Dini Risiko Hipoksemia\",\"186\",\"187\",\"188\",\"Hipoksemia merupakan kondisi rendahnya kadar oksigen dalam darah yang dapat berkaitan dengan berbagai gangguan kesehatan. Pemantauan saturasi oksigen dan pola pernapasan dapat membantu mengenali perubahan kondisi fisiologis lebih awal.\",\"189\",\"190\",\"Menggabungkan multi-wavelength PPG dengan sensor respirasi.\",\"191\",\"Menerapkan adaptive filtering untuk mengurangi artefak gerakan.\",\"192\",\"Mengembangkan algoritma pendeteksian kualitas sinyal sebelum menghitung parameter.\",\"193\",\"Mengirimkan informasi hasil pengukuran melalui Bluetooth atau Wi-Fi.\",\"194\",\"195\",\"196\",\"Mengintegrasikan sensor respirasi.\",\"197\",\"Mengembangkan algoritma adaptive filtering.\",\"198\",\"Menghitung SpO2 dan parameter respirasi.\",\"199\",\"Menguji hasil pengukuran terhadap alat referensi yang tervalidasi.\",\"200\",\"Mengukur akurasi, latency, dan konsumsi daya.\",\"201\",\"202\",\"Prototype portable oxygen monitoring.\",\"203\",\"Algoritma adaptive signal processing.\",\"204\",\"Dashboard monitoring dan notifikasi.\",\"205\",\"10. ORAL-SCAN\",\"206\",\"Portable Oral Lesion Screening Berbasis Multispectral LED Imaging dan Edge AI untuk Identifikasi Awal Kelainan Mukosa Mulut\",\"207\",\"208\",\"209\",\"Kelainan mukosa mulut dapat berkembang menjadi kondisi yang lebih serius apabila tidak teridentifikasi dan diperiksa lebih lanjut. Pemeriksaan visual awal dapat dibantu dengan teknologi pencitraan portabel.\",\"210\",\"211\",\"Mengintegrasikan kamera makro dan pencahayaan LED multispektral.\",\"212\",\"Mengambil citra dengan beberapa kondisi pencahayaan.\",\"213\",\"Menggunakan analisis tekstur dan warna untuk mengidentifikasi pola kelainan.\",\"214\",\"Mengimplementasikan Edge AI untuk analisis citra secara langsung.\",\"215\",\"216\",\"Merancang perangkat kamera makro.\",\"217\",\"Mengintegrasikan beberapa kanal LED.\",\"218\",\"Mengembangkan sistem akuisisi citra terstandar.\",\"219\",\"Melakukan preprocessing dan ekstraksi fitur.\",\"220\",\"Mengembangkan CNN untuk klasifikasi citra.\",\"221\",\"Melakukan validasi dengan dataset dan penilaian tenaga medis.\",\"222\",\"223\",\"Prototype portable oral scanner.\",\"224\",\"Model AI untuk skrining citra.\",\"225\",\"Aplikasi visualisasi hasil pemeriksaan.\",\"226\",\"Catatan: sistem tidak menggantikan pemeriksaan dokter gigi atau biopsi untuk penegakan diagnosis.\",\"227\",\"B. Perbandingan dan pemeringkatan potensi judul\",\"228\",\"Untuk menentukan mana yang paling layak dikembangkan, berikut perbandingan berdasarkan aspek kebaruan, keterkaitan dengan Telekomunikasi, dan kemudahan pembuatan prototype.\",\"229\",\"No.\",\"230\",\"Judul\",\"231\",\"Kebaruan teknologi\",\"232\",\"Kesesuaian Telekomunikasi\",\"233\",\"Kompleksitas\",\"234\",\"235\",\"PULMO-SCAN\",\"236\",\"237\",\"Sangat tinggi\",\"238\",\"239\",\"240\",\"VASCULAR-SENSE\",\"241\",\"242\",\"243\",\"244\",\"245\",\"NEUROSTEP\",\"246\",\"247\",\"248\",\"249\",\"250\",\"THROMBO-ALERT\",\"251\",\"252\",\"253\",\"254\",\"255\",\"RENAL-WATCH\",\"256\",\"257\",\"258\",\"259\",\"260\",\"RETINA-LINK\",\"261\",\"262\",\"263\",\"264\",\"265\",\"CARDIO-VOICE\",\"266\",\"267\",\"268\",\"269\",\"270\",\"STROKE-MON\",\"271\",\"272\",\"273\",\"274\",\"275\",\"OXYSENSE\",\"276\",\"277\",\"278\",\"279\",\"280\",\"ORAL-SCAN\",\"281\",\"282\",\"283\",\"284\",\"Penilaian tersebut merupakan pertimbangan awal konseptual, bukan hasil pengukuran novelty atau penilaian resmi reviewer.\",\"285\",\"C. Tiga judul yang paling saya rekomendasikan\",\"286\",\"287\",\"Pilihan pertama\",\"288\",\"289\",\"Alasan:\",\"290\",\"Mengangkat masalah kesehatan yang relevan.\",\"291\",\"Sangat sesuai dengan keahlian pengolahan sinyal digital.\",\"292\",\"Dapat menggabungkan elektronika, sensor, AI, dan IoT.\",\"293\",\"Memiliki potensi menghasilkan prototype yang bisa didemonstrasikan.\",\"294\",\"Keunggulan presentasi:\",\"295\",\" mahasiswa dapat memperlihatkan proses perekaman suara napas, pemrosesan sinyal, hingga hasil analisis secara langsung.\",\"296\",\"2. NEUROSTEP\",\"297\",\"Pilihan kedua\",\"298\",\"299\",\"300\",\"Bentuk produknya konkret dan mudah dipahami reviewer.\",\"301\",\"Integrasi sensor tekanan dan IMU memperlihatkan kompetensi elektronika telekomunikasi.\",\"302\",\"Data dapat ditampilkan secara visual dalam bentuk heatmap tekanan kaki.\",\"303\",\"Memiliki peluang pengembangan untuk monitoring pasien diabetes.\",\"304\",\"305\",\" reviewer dapat melihat langsung perubahan distribusi tekanan ketika seseorang berjalan.\",\"306\",\"3. CARDIO-VOICE\",\"307\",\"Alternatif ketiga\",\"308\",\"309\",\"310\",\"Sangat relevan dengan pengolahan sinyal digital.\",\"311\",\"Memiliki tantangan teknis yang jelas, seperti filtering, segmentasi, dan klasifikasi sinyal.\",\"312\",\"Dapat dikembangkan dengan komponen yang relatif terjangkau.\",\"313\",\"Demonstrasi prototype relatif menarik.\",\"314\",\"315\",\" menampilkan perbedaan karakteristik sinyal bunyi jantung dan hasil pemrosesan digital.\",\"316\",\"D. Belajar dari pemenang PIMNAS 2025\",\"317\",\"Ada tiga karya PKM-KC bidang kesehatan yang menurut saya sangat relevan untuk dipelajari:\",\"318\",\"Karya\",\"319\",\"Prestasi PIMNAS 38\",\"320\",\"Pelajaran untuk proposal baru\",\"321\",\"Sistem peringatan dini TB melalui suara batuk (ITS)\",\"322\",\"Emas KC-1\",\"323\",\"Penggunaan sinyal akustik untuk skrining kesehatan\",\"324\",\"Cardioguard (UGM)\",\"325\",\"Perak KC-1\",\"326\",\"Integrasi wearable, AI, IoT, dan perangkat keras\",\"327\",\"Orside (UGM)\",\"328\",\"Emas KC-2\",\"329\",\"Integrasi teknologi sensor optik dan deep learning\",\"330\",\"Sumber daftar pemenang: \",\"331\",\"332\",\"SK Pemenang PIMNAS 2025\",\"333\",\". Informasi Cardioguard juga dijelaskan oleh \",\"334\",\"335\",\"336\",\"337\",\"Hal yang perlu diperhatikan: jangan membuat proposal yang hanya mengganti nama perangkat atau mengganti algoritma dari karya pemenang. Misalnya, membuat ulang alat deteksi TB dengan suara batuk dan CNN saja belum menunjukkan kebaruan yang kuat.\",\"338\",\"Kita perlu memiliki pembeda pada mekanisme pengukuran, kombinasi sensor, metode pengolahan, atau fungsi perangkat.\",\"339\",\"E. Rekomendasi arsitektur teknologi\",\"340\",\"Agar mahasiswa memiliki gambaran implementasi, berikut arsitektur umum yang bisa digunakan untuk ketiga judul unggulan.\",\"341\",\"Arsitektur prototype HealthTech berbasis Telekomunikasi\",\"342\",\"Sensor Akuisisi Kesehatan\",\"343\",\"PPG / Mikrofon / IMU / Pressure Sensor / EMG\",\"344\",\"Embedded System\",\"345\",\"ESP32 / STM32 / Raspberry Pi\",\"346\",\"Digital Signal Processing\",\"347\",\"Filtering – Noise Reduction – Feature Extraction\",\"348\",\"Artificial Intelligence / Edge AI\",\"349\",\"Klasifikasi – Deteksi Anomali – Analisis Risiko\",\"350\",\"Wireless Communication\",\"351\",\"Bluetooth / Wi-Fi / LoRa\",\"352\",\"Dashboard dan Sistem Peringatan\",\"353\",\"Visualisasi hasil – Riwayat pengukuran – Notifikasi\",\"354\",\"F. Parameter keberhasilan prototype\",\"355\",\"Saya menyarankan mahasiswa tidak hanya menguji apakah alat dapat menyala, tetapi juga melakukan pengujian teknis yang terukur.\",\"356\",\"Aspek pengujian\",\"357\",\"Parameter\",\"358\",\"Sensor\",\"359\",\"Akurasi, sensitivitas, repeatability\",\"360\",\"Pengolahan sinyal\",\"361\",\"SNR, noise reduction, kualitas sinyal\",\"362\",\"AI\",\"363\",\"Accuracy, precision, recall, F1-score, sensitivity, specificity\",\"364\",\"Telekomunikasi\",\"365\",\"Latency, packet loss, jangkauan komunikasi\",\"366\",\"Perangkat\",\"367\",\"Konsumsi daya, waktu operasi, kestabilan\",\"368\",\"Sistem\",\"369\",\"Keberhasilan integrasi seluruh modul\",\"370\",\"Untuk pengujian AI, pembagian data harus dilakukan pada tingkat subjek/pasien agar data dari orang yang sama tidak bocor antara data pelatihan dan pengujian.\",\"371\",\"G. Satu hal penting sebelum proposal disusun\",\"372\",\"Pedoman PKM 2026 mendefinisikan PKM-KC sebagai kegiatan menghasilkan karya baru yang fungsional dan tidak sekadar meniru produk yang telah ada. Luaran wajibnya mencakup prototype atau produk fungsional, laporan kemajuan, laporan akhir, dan akun media sosial. \",\"373\",[1126,1125],\"374\",\"375\",\"Karena itu, saya menyarankan tim memilih satu masalah kesehatan, kemudian melakukan studi pembanding produk dan penelitian terdahulu sebelum menetapkan klaim novelty.\",\"376\",\"Pilihan saya: PULMO-SCAN atau NEUROSTEP.\",\"377\",\" Keduanya memberikan ruang yang cukup besar untuk menunjukkan identitas keilmuan Sistem Telekomunikasi.\",\"378\",\"Kalau saya bertindak sebagai dosen pembimbing, saya akan mengarahkan mahasiswa membuat satu alat yang benar-benar bekerja, memiliki kebaruan yang terukur, dan bisa didemonstrasikan di hadapan reviewer, daripada membuat sistem yang terlalu luas tetapi tidak selesai.\",\"6cc1a6c9-9ce8-40a5-a2f2-0599ca92e6a6\",\"c2d12dfc-ff61-481e-ac2b-93012024cdf9\",[2078],\"# 10 Alternatif Judul PKM-KC Bidang Kesehatan dan Telekomunikasi\\n\\n**Tema besar: Inovasi perangkat deteksi dini penyakit berbasis sensor, pengolahan sinyal digital, IoT, dan kecerdasan buatan.**\\n\\nUntuk skema PKM-KC, saya menyarankan agar mahasiswa tidak sekadar membuat aplikasi kesehatan, tetapi menghasilkan **prototype alat yang memiliki fungsi nyata, keunggulan teknologi, dan dapat diuji secara kuantitatif**.\\n\\nInspirasi dari karya-karya berprestasi PIMNAS 2025 dapat diterapkan melalui tiga pendekatan:\\n1. Mengembangkan alat kesehatan yang menjawab permasalahan nyata.\\n2. Mengintegrasikan beberapa teknologi menjadi satu sistem yang memiliki fungsi baru.\\n3. Membuktikan manfaat inovasi melalui pengujian prototype, bukan hanya simulasi atau desain konseptual.\\n\\nSepuluh alternatif berikut dirancang agar tetap berakar pada kompetensi Sistem Telekomunikasi, khususnya elektronika, sensor, komunikasi nirkabel, pengolahan sinyal, dan AI.\\n\\n## A. Sepuluh alternatif judul dan rancangan inovasi\\n\\n### 1. PULMO-SCAN\\n**Portable Respiratory Acoustic Analyzer Berbasis Multi-Sensor dan Edge AI untuk Skrining Awal Gangguan Fungsi Pernapasan**\\n\\n\u003cbadge color=\\\"success\\\"\u003eRekomendasi utama\u003c/badge\u003e \u003cbadge\u003ePKM-KC\u003c/badge\u003e\\n\\n\u003cAsyncImage query=\\\"portable respiratory lung sound digital stethoscope medical device prototype electronics\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Latar belakang**\\n\\nGangguan pernapasan seperti asma dan penyakit paru obstruktif kronis (PPOK) membutuhkan pemeriksaan untuk mengetahui kondisi fungsi pernapasan. Pemeriksaan konvensional memerlukan tenaga kesehatan dan perangkat khusus. Di sisi lain, suara napas mengandung informasi akustik yang dapat dianalisis untuk membantu skrining awal.\\n\\n**Kebaruan (novelty)**\\n- Menggabungkan mikrofon kontak atau sensor suara dengan sensor aliran udara.\\n- Memproses karakteristik suara inspirasi dan ekspirasi.\\n- Menggunakan Edge AI untuk mengklasifikasikan pola suara napas.\\n- Hasil analisis dapat ditampilkan langsung tanpa ketergantungan koneksi internet.\\n\\n**Metode pengembangan**\\n1. Merancang perangkat akuisisi suara pernapasan.\\n2. Mengintegrasikan mikrofon kontak, sensor aliran udara, dan mikrokontroler.\\n3. Melakukan filtering, ekstraksi MFCC, dan analisis fitur spektral.\\n4. Mengembangkan model klasifikasi ringan.\\n5. Menguji kualitas akuisisi, waktu pemrosesan, dan performa klasifikasi menggunakan dataset tervalidasi.\\n\\n**Luaran**\\n- Prototype alat perekam dan analisis suara pernapasan.\\n- Dashboard hasil skrining.\\n- Model Edge AI.\\n- Data hasil pengujian performa alat.\\n\\n---\\n\\n### 2. VASCULAR-SENSE\\n**Wearable Photoplethysmography Multi-Wavelength Berbasis AI untuk Skrining Dini Risiko Gangguan Sirkulasi Perifer pada Penderita Diabetes**\\n\\n\u003cAsyncImage query=\\\"wearable photoplethysmography PPG sensor finger pulse oximeter medical electronics prototype\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Latar belakang**\\n\\nPenderita diabetes memiliki risiko mengalami gangguan sirkulasi perifer yang dapat berujung pada luka kaki diabetik. Pemantauan kondisi sirkulasi secara berkala diperlukan untuk membantu mengidentifikasi perubahan kondisi lebih awal.\\n\\n**Kebaruan**\\n- Menggabungkan sensor PPG dengan beberapa panjang gelombang cahaya.\\n- Menganalisis perubahan bentuk gelombang, amplitudo, dan waktu kedatangan pulsa.\\n- Mengembangkan algoritma untuk mendeteksi pola yang mengindikasikan risiko gangguan perfusi perifer.\\n- Memiliki fitur transmisi data nirkabel untuk pemantauan berkala.\\n\\n**Metode pengembangan**\\n1. Merancang sensor PPG multi-wavelength.\\n2. Mengembangkan rangkaian penguat dan filter sinyal.\\n3. Melakukan ekstraksi fitur sinyal PPG.\\n4. Mengembangkan algoritma klasifikasi atau deteksi anomali.\\n5. Menguji stabilitas sinyal dan membandingkan hasil pengukuran dengan alat referensi serta penilaian tenaga medis.\\n\\n**Luaran**\\n- Prototype wearable sensor PPG.\\n- Sistem analisis sinyal perfusi.\\n- Aplikasi monitoring.\\n- Hasil uji akurasi dan stabilitas pengukuran.\\n\\n---\\n\\n### 3. NEUROSTEP\\n**Smart Insole Berbasis Pressure Sensor Array dan Inertial Measurement Unit untuk Deteksi Dini Risiko Neuropati Diabetik melalui Analisis Pola Berjalan**\\n\\n\u003cAsyncImage query=\\\"smart insole pressure sensor array gait analysis wearable prototype\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Latar belakang**\\n\\nNeuropati diabetik dapat menyebabkan penurunan sensitivitas kaki dan perubahan pola berjalan. Perubahan distribusi tekanan telapak kaki berpotensi menjadi indikator untuk mengidentifikasi risiko gangguan tersebut.\\n\\n**Kebaruan**\\n- Mengintegrasikan sensor tekanan pada beberapa titik telapak kaki.\\n- Mengombinasikan data tekanan dengan sensor IMU.\\n- Menggunakan algoritma analisis gait untuk mengidentifikasi perubahan pola berjalan.\\n- Mengirimkan hasil pengukuran secara nirkabel.\\n\\n**Metode pengembangan**\\n1. Merancang insole dengan pressure sensor array.\\n2. Mengintegrasikan IMU dan mikrokontroler.\\n3. Mengembangkan sistem akuisisi data.\\n4. Melakukan filtering dan ekstraksi fitur gait.\\n5. Mengembangkan algoritma klasifikasi pola berjalan.\\n6. Menguji akurasi pengukuran tekanan dan konsistensi klasifikasi.\\n\\n**Luaran**\\n- Prototype smart insole.\\n- Aplikasi visualisasi distribusi tekanan.\\n- Algoritma analisis gait.\\n- Laporan pengujian prototype.\\n\\n---\\n\\n### 4. THROMBO-ALERT\\n**Sistem Wearable Multi-Sensor Berbasis Bioimpedance dan Photoplethysmography untuk Monitoring Perubahan Hemodinamik Perifer secara Real-Time**\\n\\n\u003cAsyncImage query=\\\"wearable bioimpedance medical sensor electrode electronics prototype wrist\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Latar belakang**\\n\\nPerubahan kondisi aliran darah perifer dapat berkaitan dengan berbagai gangguan vaskular. Dibutuhkan perangkat yang dapat mengamati perubahan parameter fisiologis secara kontinu dan memberikan informasi ketika ditemukan pola yang tidak biasa.\\n\\n**Kebaruan**\\n- Menggabungkan pengukuran bioimpedansi dan PPG.\\n- Menganalisis perubahan impedansi jaringan dan karakteristik pulsa darah.\\n- Mengembangkan sistem sensor fusion untuk mengurangi kesalahan akibat pembacaan satu sensor.\\n- Memberikan peringatan ketika ditemukan perubahan parameter yang melewati batas pengujian.\\n\\n**Metode pengembangan**\\n1. Merancang rangkaian bioimpedansi frekuensi rendah yang aman.\\n2. Mengintegrasikan sensor PPG.\\n3. Melakukan akuisisi dan sinkronisasi kedua sinyal.\\n4. Mengembangkan algoritma sensor fusion.\\n5. Menguji repeatability, sensitivitas, dan respons sistem.\\n\\n**Luaran**\\n- Prototype wearable multi-sensor.\\n- Algoritma pengolahan sinyal.\\n- Sistem notifikasi perubahan parameter.\\n\\nCatatan: prototype ini diarahkan untuk monitoring parameter perifer, bukan mendiagnosis trombosis atau emboli paru.\\n\\n---\\n\\n### 5. RENAL-WATCH\\n**Portable Bioimpedance Spectroscopy Berbasis IoT untuk Monitoring Perubahan Cairan Tubuh sebagai Sistem Peringatan Dini Risiko Gangguan Keseimbangan Cairan**\\n\\n\u003cAsyncImage query=\\\"portable bioimpedance spectroscopy body composition medical analyzer electrode prototype\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Latar belakang**\\n\\nPerubahan keseimbangan cairan tubuh penting dipantau pada individu dengan risiko gangguan fungsi ginjal dan penyakit kardiovaskular. Pengukuran bioimpedansi dapat digunakan untuk memperkirakan perubahan karakteristik cairan tubuh, meskipun tidak dapat menggantikan pemeriksaan fungsi ginjal.\\n\\n**Kebaruan**\\n- Menggunakan bioimpedance spectroscopy pada beberapa frekuensi.\\n- Mengintegrasikan sensor suhu dan pemantauan kondisi pengukuran.\\n- Menggunakan algoritma untuk mendeteksi perubahan tren impedansi.\\n- Memiliki komunikasi nirkabel untuk mengirimkan data secara berkala.\\n\\n**Metode pengembangan**\\n1. Merancang rangkaian injeksi dan pengukuran impedansi berarus rendah.\\n2. Mengembangkan sistem pengukuran multi-frekuensi.\\n3. Mengintegrasikan mikrokontroler dan modul komunikasi.\\n4. Melakukan kalibrasi terhadap beban referensi.\\n5. Menguji repeatability dan konsistensi hasil pengukuran.\\n\\n**Luaran**\\n- Prototype portable bioimpedance analyzer.\\n- Dashboard monitoring perubahan impedansi.\\n- Algoritma analisis tren data.\\n\\n---\\n\\n### 6. RETINA-LINK\\n**Portable Retinal Image Acquisition Berbasis Smartphone dan Edge AI untuk Skrining Awal Risiko Retinopati Diabetik**\\n\\n\u003cAsyncImage query=\\\"portable smartphone retinal fundus camera ophthalmology imaging attachment prototype\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Latar belakang**\\n\\nRetinopati diabetik merupakan salah satu komplikasi diabetes yang dapat mengakibatkan gangguan penglihatan. Pemeriksaan retina memerlukan alat khusus dan tidak selalu mudah dijangkau masyarakat.\\n\\n**Kebaruan**\\n- Mengembangkan modul akuisisi citra retina portabel.\\n- Mengoptimalkan pencahayaan dan fokus melalui sistem elektronika.\\n- Menggunakan Edge AI untuk analisis citra retina.\\n- Memungkinkan penyimpanan dan transmisi hasil pemeriksaan melalui jaringan nirkabel.\\n\\n**Metode pengembangan**\\n1. Merancang modul optik dan pencahayaan.\\n2. Mengembangkan sistem pengambilan citra retina.\\n3. Melakukan preprocessing citra.\\n4. Mengembangkan CNN untuk skrining citra.\\n5. Menguji kualitas citra, sensitivitas, spesifisitas, dan waktu pemrosesan.\\n\\n**Luaran**\\n- Prototype retinal image acquisition.\\n- Model AI untuk skrining.\\n- Aplikasi penyimpanan hasil pemeriksaan.\\n\\nCatatan: perlu tenaga ahli mata untuk validasi citra dan pengujian. Jangan mengklaim diagnosis otomatis tanpa validasi klinis.\\n\\n---\\n\\n### 7. CARDIO-VOICE\\n**Sistem Skrining Risiko Gangguan Jantung Berbasis Analisis Fonokardiogram Digital dan Edge AI dengan Komunikasi Nirkabel**\\n\\n\u003cAsyncImage query=\\\"digital electronic stethoscope phonocardiogram heart sound sensor prototype\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Latar belakang**\\n\\nBunyi jantung mengandung informasi akustik mengenai aktivitas mekanis jantung. Perubahan karakteristik bunyi jantung dapat berkaitan dengan kondisi abnormal, sehingga analisis fonokardiogram (PCG) berpotensi membantu skrining awal.\\n\\n**Kebaruan**\\n- Mengembangkan stetoskop digital berbasis sensor akustik kontak.\\n- Menggabungkan analisis PCG dan fitur denyut jantung.\\n- Menerapkan noise cancellation untuk mengurangi gangguan suara lingkungan.\\n- Menggunakan Edge AI untuk klasifikasi pola bunyi jantung.\\n\\n**Metode pengembangan**\\n1. Mengembangkan rangkaian sensor akustik.\\n2. Mengimplementasikan filter digital untuk menghilangkan noise.\\n3. Melakukan segmentasi siklus bunyi jantung.\\n4. Mengekstraksi fitur MFCC dan spektral.\\n5. Mengembangkan model klasifikasi.\\n6. Menguji performa dengan dataset PCG tervalidasi.\\n\\n**Luaran**\\n- Prototype stetoskop digital.\\n- Sistem analisis PCG.\\n- Model Edge AI.\\n- Aplikasi monitoring hasil skrining.\\n\\n---\\n\\n### 8. STROKE-MON\\n**Wearable Neuro-Motor Sensor Berbasis IMU dan Surface EMG dengan Edge AI untuk Deteksi Dini Asimetri Gerak sebagai Indikator Risiko Stroke**\\n\\n\u003cAsyncImage query=\\\"wearable surface EMG sensor armband IMU rehabilitation electronics prototype\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Latar belakang**\\n\\nAsimetri gerak dan perubahan aktivitas otot dapat ditemukan pada individu dengan gangguan neuromotor. Pemantauan gerakan tubuh secara objektif dapat membantu mengidentifikasi perubahan fungsi motorik.\\n\\n**Kebaruan**\\n- Menggabungkan sensor IMU dan surface EMG.\\n- Mengukur perbedaan aktivitas otot dan pola gerak kanan-kiri.\\n- Mengembangkan algoritma pengenalan asimetri gerak.\\n- Menggunakan komunikasi nirkabel untuk mengirimkan hasil pengukuran.\\n\\n**Metode pengembangan**\\n1. Merancang wearable sensor IMU dan EMG.\\n2. Mengembangkan akuisisi sinyal secara simultan.\\n3. Melakukan filtering dan normalisasi sinyal.\\n4. Mengekstraksi fitur aktivitas otot dan gerakan.\\n5. Mengembangkan algoritma klasifikasi asimetri.\\n6. Menguji prototype dengan protokol gerakan terstandar.\\n\\n**Luaran**\\n- Prototype wearable neuro-motor.\\n- Algoritma analisis asimetri gerak.\\n- Aplikasi monitoring.\\n\\nCatatan: alat ini lebih tepat disebut sistem pemantauan asimetri motorik, bukan alat diagnosis atau prediksi stroke.\\n\\n---\\n\\n### 9. OXYSENSE\\n**Portable Multi-Wavelength PPG dan Respiratory Sensor dengan Adaptive Signal Processing untuk Skrining Dini Risiko Hipoksemia**\\n\\n\u003cAsyncImage query=\\\"portable pulse oximeter respiratory monitoring medical wearable sensor device\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Latar belakang**\\n\\nHipoksemia merupakan kondisi rendahnya kadar oksigen dalam darah yang dapat berkaitan dengan berbagai gangguan kesehatan. Pemantauan saturasi oksigen dan pola pernapasan dapat membantu mengenali perubahan kondisi fisiologis lebih awal.\\n\\n**Kebaruan**\\n- Menggabungkan multi-wavelength PPG dengan sensor respirasi.\\n- Menerapkan adaptive filtering untuk mengurangi artefak gerakan.\\n- Mengembangkan algoritma pendeteksian kualitas sinyal sebelum menghitung parameter.\\n- Mengirimkan informasi hasil pengukuran melalui Bluetooth atau Wi-Fi.\\n\\n**Metode pengembangan**\\n1. Merancang sensor PPG multi-wavelength.\\n2. Mengintegrasikan sensor respirasi.\\n3. Mengembangkan algoritma adaptive filtering.\\n4. Menghitung SpO2 dan parameter respirasi.\\n5. Menguji hasil pengukuran terhadap alat referensi yang tervalidasi.\\n6. Mengukur akurasi, latency, dan konsumsi daya.\\n\\n**Luaran**\\n- Prototype portable oxygen monitoring.\\n- Algoritma adaptive signal processing.\\n- Dashboard monitoring dan notifikasi.\\n\\n---\\n\\n### 10. ORAL-SCAN\\n**Portable Oral Lesion Screening Berbasis Multispectral LED Imaging dan Edge AI untuk Identifikasi Awal Kelainan Mukosa Mulut**\\n\\n\u003cAsyncImage query=\\\"portable oral examination camera multispectral LED imaging medical device prototype\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Latar belakang**\\n\\nKelainan mukosa mulut dapat berkembang menjadi kondisi yang lebih serius apabila tidak teridentifikasi dan diperiksa lebih lanjut. Pemeriksaan visual awal dapat dibantu dengan teknologi pencitraan portabel.\\n\\n**Kebaruan**\\n- Mengintegrasikan kamera makro dan pencahayaan LED multispektral.\\n- Mengambil citra dengan beberapa kondisi pencahayaan.\\n- Menggunakan analisis tekstur dan warna untuk mengidentifikasi pola kelainan.\\n- Mengimplementasikan Edge AI untuk analisis citra secara langsung.\\n\\n**Metode pengembangan**\\n1. Merancang perangkat kamera makro.\\n2. Mengintegrasikan beberapa kanal LED.\\n3. Mengembangkan sistem akuisisi citra terstandar.\\n4. Melakukan preprocessing dan ekstraksi fitur.\\n5. Mengembangkan CNN untuk klasifikasi citra.\\n6. Melakukan validasi dengan dataset dan penilaian tenaga medis.\\n\\n**Luaran**\\n- Prototype portable oral scanner.\\n- Model AI untuk skrining citra.\\n- Aplikasi visualisasi hasil pemeriksaan.\\n\\nCatatan: sistem tidak menggantikan pemeriksaan dokter gigi atau biopsi untuk penegakan diagnosis.\\n\\n---\\n\\n## B. Perbandingan dan pemeringkatan potensi judul\\n\\nUntuk menentukan mana yang paling layak dikembangkan, berikut perbandingan berdasarkan aspek kebaruan, keterkaitan dengan Telekomunikasi, dan kemudahan pembuatan prototype.\\n\\n| No. | Judul | Kebaruan teknologi | Kesesuaian Telekomunikasi | Kompleksitas |\\n|---|---|---|---|---|\\n| 1 | PULMO-SCAN | Tinggi | Sangat tinggi | Sedang |\\n| 2 | VASCULAR-SENSE | Tinggi | Sangat tinggi | Tinggi |\\n| 3 | NEUROSTEP | Tinggi | Sangat tinggi | Sedang |\\n| 4 | THROMBO-ALERT | Tinggi | Sangat tinggi | Tinggi |\\n| 5 | RENAL-WATCH | Tinggi | Sangat tinggi | Tinggi |\\n| 6 | RETINA-LINK | Sedang–tinggi | Tinggi | Tinggi |\\n| 7 | CARDIO-VOICE | Tinggi | Sangat tinggi | Sedang |\\n| 8 | STROKE-MON | Tinggi | Sangat tinggi | Tinggi |\\n| 9 | OXYSENSE | Sedang–tinggi | Sangat tinggi | Sedang |\\n| 10 | ORAL-SCAN | Tinggi | Tinggi | Tinggi |\\n\\n*Penilaian tersebut merupakan pertimbangan awal konseptual, bukan hasil pengukuran novelty atau penilaian resmi reviewer.*\\n\\n## C. Tiga judul yang paling saya rekomendasikan\\n\\n\u003cbox border radius=\\\"lg\\\" padding={3} gap={3}\u003e\\n  \u003crow align=\\\"center\\\" justify=\\\"between\\\"\u003e\\n    **1. PULMO-SCAN**\\n    \u003cbadge color=\\\"success\\\"\u003ePilihan pertama\u003c/badge\u003e\\n  \u003c/row\u003e\\n  \u003cAsyncImage query=\\\"portable digital respiratory sound analyzer medical electronic stethoscope prototype\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n  **Alasan:**\\n  - Mengangkat masalah kesehatan yang relevan.\\n  - Sangat sesuai dengan keahlian pengolahan sinyal digital.\\n  - Dapat menggabungkan elektronika, sensor, AI, dan IoT.\\n  - Memiliki potensi menghasilkan prototype yang bisa didemonstrasikan.\\n\\n  **Keunggulan presentasi:** mahasiswa dapat memperlihatkan proses perekaman suara napas, pemrosesan sinyal, hingga hasil analisis secara langsung.\\n  \u003cdivider color=\\\"subtle\\\"/\u003e\\n  \u003crow align=\\\"center\\\" justify=\\\"between\\\"\u003e\\n    **2. NEUROSTEP**\\n    \u003cbadge color=\\\"success\\\"\u003ePilihan kedua\u003c/badge\u003e\\n  \u003c/row\u003e\\n  \u003cAsyncImage query=\\\"smart pressure sensing insole gait analysis prototype electronics\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n  **Alasan:**\\n  - Bentuk produknya konkret dan mudah dipahami reviewer.\\n  - Integrasi sensor tekanan dan IMU memperlihatkan kompetensi elektronika telekomunikasi.\\n  - Data dapat ditampilkan secara visual dalam bentuk heatmap tekanan kaki.\\n  - Memiliki peluang pengembangan untuk monitoring pasien diabetes.\\n\\n  **Keunggulan presentasi:** reviewer dapat melihat langsung perubahan distribusi tekanan ketika seseorang berjalan.\\n  \u003cdivider color=\\\"subtle\\\"/\u003e\\n  \u003crow align=\\\"center\\\" justify=\\\"between\\\"\u003e\\n    **3. CARDIO-VOICE**\\n    \u003cbadge\u003eAlternatif ketiga\u003c/badge\u003e\\n  \u003c/row\u003e\\n  \u003cAsyncImage query=\\\"electronic digital phonocardiogram stethoscope prototype heart sound analyzer\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n  **Alasan:**\\n  - Sangat relevan dengan pengolahan sinyal digital.\\n  - Memiliki tantangan teknis yang jelas, seperti filtering, segmentasi, dan klasifikasi sinyal.\\n  - Dapat dikembangkan dengan komponen yang relatif terjangkau.\\n  - Demonstrasi prototype relatif menarik.\\n\\n  **Keunggulan presentasi:** menampilkan perbedaan karakteristik sinyal bunyi jantung dan hasil pemrosesan digital.\\n\u003c/box\u003e\\n\\n## D. Belajar dari pemenang PIMNAS 2025\\n\\nAda tiga karya PKM-KC bidang kesehatan yang menurut saya sangat relevan untuk dipelajari:\\n\\n| Karya | Prestasi PIMNAS 38 | Pelajaran untuk proposal baru |\\n|---|---|---|\\n| Sistem peringatan dini TB melalui suara batuk (ITS) | Emas KC-1 | Penggunaan sinyal akustik untuk skrining kesehatan |\\n| Cardioguard (UGM) | Perak KC-1 | Integrasi wearable, AI, IoT, dan perangkat keras |\\n| Orside (UGM) | Emas KC-2 | Integrasi teknologi sensor optik dan deep learning |\\n\\nSumber daftar pemenang: [SK Pemenang PIMNAS 2025](https://simbelmawa.kemdiktisaintek.go.id/portal/wp-content/uploads/2026/11/SK-Pemenang-PIMNAS-2025-Rev-1.pdf). Informasi Cardioguard juga dijelaskan oleh \u003cLink ref=\\\"turn950386search4\\\" title=\\\"Departemen Teknik Elektro dan Teknologi Informasi UGM\\\"/\u003e. \\n\\nHal yang perlu diperhatikan: jangan membuat proposal yang hanya mengganti nama perangkat atau mengganti algoritma dari karya pemenang. Misalnya, membuat ulang alat deteksi TB dengan suara batuk dan CNN saja belum menunjukkan kebaruan yang kuat.\\n\\nKita perlu memiliki pembeda pada mekanisme pengukuran, kombinasi sensor, metode pengolahan, atau fungsi perangkat.\\n\\n## E. Rekomendasi arsitektur teknologi\\n\\nAgar mahasiswa memiliki gambaran implementasi, berikut arsitektur umum yang bisa digunakan untuk ketiga judul unggulan.\\n\\n\u003cbox border radius=\\\"lg\\\" padding={3} gap={2}\u003e\\n  **Arsitektur prototype HealthTech berbasis Telekomunikasi**\\n  \u003cbox background=\\\"rgba(59,130,246,0.09)\\\" radius=\\\"md\\\" padding={3} align=\\\"center\\\"\u003e\\n    \u003cicon name=\\\"activity\\\" size=\\\"xl\\\" color=\\\"#3B82F6\\\"/\u003e\\n    **Sensor Akuisisi Kesehatan**\\n\\n    \u003ctext color=\\\"secondary\\\" size=\\\"xs\\\"\u003ePPG / Mikrofon / IMU / Pressure Sensor / EMG\u003c/text\u003e\\n  \u003c/box\u003e\\n  \u003cbox align=\\\"center\\\"\u003e\\n    \u003cicon name=\\\"arrow-down\\\" color=\\\"secondary\\\" size=\\\"lg\\\"/\u003e\\n  \u003c/box\u003e\\n  \u003cbox background=\\\"rgba(59,130,246,0.09)\\\" radius=\\\"md\\\" padding={3} align=\\\"center\\\"\u003e\\n    **Embedded System**\\n\\n    \u003ctext color=\\\"secondary\\\" size=\\\"xs\\\"\u003eESP32 / STM32 / Raspberry Pi\u003c/text\u003e\\n  \u003c/box\u003e\\n  \u003cbox align=\\\"center\\\"\u003e\\n    \u003cicon name=\\\"arrow-down\\\" color=\\\"secondary\\\" size=\\\"lg\\\"/\u003e\\n  \u003c/box\u003e\\n  \u003cbox background=\\\"rgba(16,185,129,0.10)\\\" radius=\\\"md\\\" padding={3} align=\\\"center\\\"\u003e\\n    **Digital Signal Processing**\\n\\n    \u003ctext color=\\\"secondary\\\" size=\\\"xs\\\"\u003eFiltering – Noise Reduction – Feature Extraction\u003c/text\u003e\\n  \u003c/box\u003e\\n  \u003cbox align=\\\"center\\\"\u003e\\n    \u003cicon name=\\\"arrow-down\\\" color=\\\"secondary\\\" size=\\\"lg\\\"/\u003e\\n  \u003c/box\u003e\\n  \u003cbox background=\\\"rgba(16,185,129,0.10)\\\" radius=\\\"md\\\" padding={3} align=\\\"center\\\"\u003e\\n    **Artificial Intelligence / Edge AI**\\n\\n    \u003ctext color=\\\"secondary\\\" size=\\\"xs\\\"\u003eKlasifikasi – Deteksi Anomali – Analisis Risiko\u003c/text\u003e\\n  \u003c/box\u003e\\n  \u003cbox align=\\\"center\\\"\u003e\\n    \u003cicon name=\\\"arrow-down\\\" color=\\\"secondary\\\" size=\\\"lg\\\"/\u003e\\n  \u003c/box\u003e\\n  \u003cbox background=\\\"rgba(245,158,11,0.10)\\\" radius=\\\"md\\\" padding={3} align=\\\"center\\\"\u003e\\n    **Wireless Communication**\\n\\n    \u003ctext color=\\\"secondary\\\" size=\\\"xs\\\"\u003eBluetooth / Wi-Fi / LoRa\u003c/text\u003e\\n  \u003c/box\u003e\\n  \u003cbox align=\\\"center\\\"\u003e\\n    \u003cicon name=\\\"arrow-down\\\" color=\\\"secondary\\\" size=\\\"lg\\\"/\u003e\\n  \u003c/box\u003e\\n  \u003cbox background=\\\"rgba(245,158,11,0.10)\\\" radius=\\\"md\\\" padding={3} align=\\\"center\\\"\u003e\\n    **Dashboard dan Sistem Peringatan**\\n\\n    \u003ctext color=\\\"secondary\\\" size=\\\"xs\\\"\u003eVisualisasi hasil – Riwayat pengukuran – Notifikasi\u003c/text\u003e\\n  \u003c/box\u003e\\n\u003c/box\u003e\\n\\n## F. Parameter keberhasilan prototype\\n\\nSaya menyarankan mahasiswa tidak hanya menguji apakah alat dapat menyala, tetapi juga melakukan pengujian teknis yang terukur.\\n\\n| Aspek pengujian | Parameter |\\n|---|---|\\n| Sensor | Akurasi, sensitivitas, repeatability |\\n| Pengolahan sinyal | SNR, noise reduction, kualitas sinyal |\\n| AI | Accuracy, precision, recall, F1-score, sensitivity, specificity |\\n| Telekomunikasi | Latency, packet loss, jangkauan komunikasi |\\n| Perangkat | Konsumsi daya, waktu operasi, kestabilan |\\n| Sistem | Keberhasilan integrasi seluruh modul |\\n\\nUntuk pengujian AI, pembagian data harus dilakukan pada tingkat subjek/pasien agar data dari orang yang sama tidak bocor antara data pelatihan dan pengujian.\\n\\n---\\n\\n## G. Satu hal penting sebelum proposal disusun\\n\\nPedoman PKM 2026 mendefinisikan PKM-KC sebagai kegiatan menghasilkan karya baru yang fungsional dan tidak sekadar meniru produk yang telah ada. Luaran wajibnya mencakup prototype atau produk fungsional, laporan kemajuan, laporan akhir, dan akun media sosial. \u003cCite refs={[\\\"turn950386search33\\\",\\\"turn950386search34\\\"]}/\u003e\\n\\nKarena itu, saya menyarankan tim memilih satu masalah kesehatan, kemudian melakukan studi pembanding produk dan penelitian terdahulu sebelum menetapkan klaim novelty.\\n\\n**Pilihan saya: PULMO-SCAN atau NEUROSTEP.** Keduanya memberikan ruang yang cukup besar untuk menunjukkan identitas keilmuan Sistem Telekomunikasi.\\n\\nKalau saya bertindak sebagai dosen pembimbing, saya akan mengarahkan mahasiswa membuat satu alat yang benar-benar bekerja, memiliki kebaruan yang terukur, dan bisa didemonstrasikan di hadapan reviewer, daripada membuat sistem yang terlalu luas tetapi tidak selesai.\\n\\n\",{},{\"_152\":1038,\"_159\":2083,\"_54\":2084,\"_56\":2084,\"_163\":2085,\"_165\":166,\"_167\":14,\"_168\":169,\"_170\":2086,\"_172\":173},\"155796b6-ba3a-4fb8-9734-ce7d7ab8f7b1\",[902],{\"_860\":861,\"_170\":2102},1795413950.012554,{\"_855\":2100,\"_163\":2101},{\"_2087\":2088,\"_2089\":1316,\"_2090\":2091,\"_2092\":2093,\"_2094\":2095,\"_193\":194,\"_2096\":2097,\"_195\":14,\"_196\":917,\"_198\":199,\"_200\":918,\"_202\":918,\"_190\":109,\"_203\":109,\"_66\":67,\"_204\":14,\"_205\":2081,\"_206\":919,\"_2098\":34,\"_2099\":34,\"_208\":10},\"reasoning_status\",\"reasoning_ended\",\"finished_duration_sec\",\"reasoning_start_time\",1795413930.2555919,\"reasoning_end_time\",1795413949.9801056,\"reasoning_recap_type\",\"hide_all\",\"reasoning_group_id\",\"99accd48-c066-4f63-a652-589e1dc05e28\",\"hide_inline_actions\",\"disable_turn_actions\",\"reasoning_recap\",\"Memproses selama 19s\",{},{\"_152\":2081,\"_159\":2105,\"_54\":2106,\"_56\":2107,\"_163\":2108,\"_165\":166,\"_167\":14,\"_168\":169,\"_170\":2109,\"_172\":173},[1038],{\"_860\":861,\"_170\":2178},1795413950.007589,1795413950.147423,{\"_855\" \"_954\":1003},{\"_50\":945,\"_41\":928,\"_53\":1008,\"_947\":848,\"_948\":2227,\"_950\":1014,\"_951\":1011,\"_954\":1003},{\"_50\":945,\"_41\":927,\"_53\":1008,\"_947\":848,\"_948\":2226,\"_950\":1010,\"_951\":1011,\"_954\":1003},{\"_955\":956,\"_957\":958,\"_959\":1012},{\"_955\":956,\"_957\":958,\"_959\":1015},{\"_955\":956,\"_957\":958,\"_959\":1018},{\"_812\":1020,\"_1021\":-5,\"_814\":2230,\"_816\":2231,\"_62\":2232,\"_1025\":2233,\"_47\":848,\"_818\":-5,\"_50\":1027,\"_1028\":2234,\"_1030\":14},13480,13481,[],[],[],[2236],\"## A. Sepuluh alternatif judul dan rancangan inovasi\\n\\n### 1. PULMO-SCAN\\n**Portable Respiratory Acoustic Analyzer Berbasis Multi-Sensor dan Edge AI untuk Skrining Awal Gangguan Fungsi Pernapasan**\\n\\n\u003cbadge color=\\\"success\\\"\u003eRekomendasi utama\u003c/badge\u003e \u003cbadge\u003ePKM-KC\u003c/badge\u003e\\n\\n\u003cAsyncImage query=\\\"portable respiratory lung sound digital stethoscope medical device prototype electronics\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Latar belakang**\\n\\nGangguan pernapasan seperti asma dan penyakit paru obstruktif kronis (PPOK) membutuhkan pemeriksaan untuk mengetahui kondisi fungsi pernapasan. Pemeriksaan konvensional memerlukan tenaga kesehatan dan perangkat khusus. Di sisi lain, suara napas mengandung informasi akustik yang dapat dianalisis untuk membantu skrining awal.\\n\\n**Kebaruan (novelty)**\\n- Menggabungkan mikrofon kontak atau sensor suara dengan sensor aliran udara.\\n- Memproses karakteristik suara inspirasi dan ekspirasi.\\n- Menggunakan Edge AI untuk mengklasifikasikan pola suara napas.\\n- Hasil analisis dapat ditampilkan langsung tanpa ketergantungan koneksi internet.\\n\\n**Metode pengembangan**\\n1. Merancang perangkat akuisisi suara pernapasan.\\n2. Mengintegrasikan mikrofon kontak, sensor aliran udara, dan mikrokontroler.\\n3. Melakukan filtering, ekstraksi MFCC, dan analisis fitur spektral.\\n4. Mengembangkan model klasifikasi ringan.\\n5. Menguji kualitas akuisisi, waktu pemrosesan, dan performa klasifikasi menggunakan dataset tervalidasi.\\n\\n**Luaran**\\n- Prototype alat perekam dan analisis suara pernapasan.\\n- Dashboard hasil skrining.\\n- Model Edge AI.\\n- Data hasil pengujian performa alat.\\n\\n---\\n\\n### 2. VASCULAR-SENSE\\n**Wearable Photoplethysmography Multi-Wavelength Berbasis AI untuk Skrining Dini Risiko Gangguan Sirkulasi Perifer pada Penderita Diabetes**\\n\\n\u003cAsyncImage query=\\\"wearable photoplethysmography PPG sensor finger pulse oximeter medical electronics prototype\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Latar belakang**\\n\\nPenderita diabetes memiliki risiko mengalami gangguan sirkulasi perifer yang dapat berujung pada luka kaki diabetik. Pemantauan kondisi sirkulasi secara berkala diperlukan untuk membantu mengidentifikasi perubahan kondisi lebih awal.\\n\\n**Kebaruan**\\n- Menggabungkan sensor PPG dengan beberapa panjang gelombang cahaya.\\n- Menganalisis perubahan bentuk gelombang, amplitudo, dan waktu kedatangan pulsa.\\n- Mengembangkan algoritma untuk mendeteksi pola yang mengindikasikan risiko gangguan perfusi perifer.\\n- Memiliki fitur transmisi data nirkabel untuk pemantauan berkala.\\n\\n**Metode pengembangan**\\n1. Merancang sensor PPG multi-wavelength.\\n2. Mengembangkan rangkaian penguat dan filter sinyal.\\n3. Melakukan ekstraksi fitur sinyal PPG.\\n4. Mengembangkan algoritma klasifikasi atau deteksi anomali.\\n5. Menguji stabilitas sinyal dan membandingkan hasil pengukuran dengan alat referensi serta penilaian tenaga medis.\\n\\n**Luaran**\\n- Prototype wearable sensor PPG.\\n- Sistem analisis sinyal perfusi.\\n- Aplikasi monitoring.\\n- Hasil uji akurasi dan stabilitas pengukuran.\\n\\n---\\n\\n### 3. NEUROSTEP\\n**Smart Insole Berbasis Pressure Sensor Array dan Inertial Measurement Unit untuk Deteksi Dini Risiko Neuropati Diabetik melalui Analisis Pola Berjalan**\\n\\n\u003cAsyncImage query=\\\"smart insole pressure sensor array gait analysis wearable prototype\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Latar belakang**\\n\\nNeuropati diabetik dapat menyebabkan penurunan sensitivitas kaki dan perubahan pola berjalan. Perubahan distribusi tekanan telapak kaki berpotensi menjadi indikator untuk mengidentifikasi risiko gangguan tersebut.\\n\\n**Kebaruan**\\n- Mengintegrasikan sensor tekanan pada beberapa titik telapak kaki.\\n- Mengombinasikan data tekanan dengan sensor IMU.\\n- Menggunakan algoritma analisis gait untuk mengidentifikasi perubahan pola berjalan.\\n- Mengirimkan hasil pengukuran secara nirkabel.\\n\\n**Metode pengembangan**\\n1. Merancang insole dengan pressure sensor array.\\n2. Mengintegrasikan IMU dan mikrokontroler.\\n3. Mengembangkan sistem akuisisi data.\\n4. Melakukan filtering dan ekstraksi fitur gait.\\n5. Mengembangkan algoritma klasifikasi pola berjalan.\\n6. Menguji akurasi pengukuran tekanan dan konsistensi klasifikasi.\\n\\n**Luaran**\\n- Prototype smart insole.\\n- Aplikasi visualisasi distribusi tekanan.\\n- Algoritma analisis gait.\\n- Laporan pengujian prototype.\\n\\n---\\n\\n### 4. THROMBO-ALERT\\n**Sistem Wearable Multi-Sensor Berbasis Bioimpedance dan Photoplethysmography untuk Monitoring Perubahan Hemodinamik Perifer secara Real-Time**\\n\\n\u003cAsyncImage query=\\\"wearable bioimpedance medical sensor electrode electronics prototype wrist\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Latar belakang**\\n\\nPerubahan kondisi aliran darah perifer dapat berkaitan dengan berbagai gangguan vaskular. Dibutuhkan perangkat yang dapat mengamati perubahan parameter fisiologis secara kontinu dan memberikan informasi ketika ditemukan pola yang tidak biasa.\\n\\n**Kebaruan**\\n- Menggabungkan pengukuran bioimpedansi dan PPG.\\n- Menganalisis perubahan impedansi jaringan dan karakteristik pulsa darah.\\n- Mengembangkan sistem sensor fusion untuk mengurangi kesalahan akibat pembacaan satu sensor.\\n- Memberikan peringatan ketika ditemukan perubahan parameter yang melewati batas pengujian.\\n\\n**Metode pengembangan**\\n1. Merancang rangkaian bioimpedansi frekuensi rendah yang aman.\\n2. Mengintegrasikan sensor PPG.\\n3. Melakukan akuisisi dan sinkronisasi kedua sinyal.\\n4. Mengembangkan algoritma sensor fusion.\\n5. Menguji repeatability, sensitivitas, dan respons sistem.\\n\\n**Luaran**\\n- Prototype wearable multi-sensor.\\n- Algoritma pengolahan sinyal.\\n- Sistem notifikasi perubahan parameter.\\n\\nCatatan: prototype ini diarahkan untuk monitoring parameter perifer, bukan mendiagnosis trombosis atau emboli paru.\\n\\n---\\n\\n### 5. RENAL-WATCH\\n**Portable Bioimpedance Spectroscopy Berbasis IoT untuk Monitoring Perubahan Cairan Tubuh sebagai Sistem Peringatan Dini Risiko Gangguan Keseimbangan Cairan**\\n\\n\u003cAsyncImage query=\\\"portable bioimpedance spectroscopy body composition medical analyzer electrode prototype\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Latar belakang**\\n\\nPerubahan keseimbangan cairan tubuh penting dipantau pada individu dengan risiko gangguan fungsi ginjal dan penyakit kardiovaskular. Pengukuran bioimpedansi dapat digunakan untuk memperkirakan perubahan karakteristik cairan tubuh, meskipun tidak dapat menggantikan pemeriksaan fungsi ginjal.\\n\\n**Kebaruan**\\n- Menggunakan bioimpedance spectroscopy pada beberapa frekuensi.\\n- Mengintegrasikan sensor suhu dan pemantauan kondisi pengukuran.\\n- Menggunakan algoritma untuk mendeteksi perubahan tren impedansi.\\n- Memiliki komunikasi nirkabel untuk mengirimkan data secara berkala.\\n\\n**Metode pengembangan**\\n1. Merancang rangkaian injeksi dan pengukuran impedansi berarus rendah.\\n2. Mengembangkan sistem pengukuran multi-frekuensi.\\n3. Mengintegrasikan mikrokontroler dan modul komunikasi.\\n4. Melakukan kalibrasi terhadap beban referensi.\\n5. Menguji repeatability dan konsistensi hasil pengukuran.\\n\\n**Luaran**\\n- Prototype portable bioimpedance analyzer.\\n- Dashboard monitoring perubahan impedansi.\\n- Algoritma analisis tren data.\\n\\n---\\n\\n### 6. RETINA-LINK\\n**Portable Retinal Image Acquisition Berbasis Smartphone dan Edge AI untuk Skrining Awal Risiko Retinopati Diabetik**\\n\\n\u003cAsyncImage query=\\\"portable smartphone retinal fundus camera ophthalmology imaging attachment prototype\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Latar belakang**\\n\\nRetinopati diabetik merupakan salah satu komplikasi diabetes yang dapat mengakibatkan gangguan penglihatan. Pemeriksaan retina memerlukan alat khusus dan tidak selalu mudah dijangkau masyarakat.\\n\\n**Kebaruan**\\n- Mengembangkan modul akuisisi citra retina portabel.\\n- Mengoptimalkan pencahayaan dan fokus melalui sistem elektronika.\\n- Menggunakan Edge AI untuk analisis citra retina.\\n- Memungkinkan penyimpanan dan transmisi hasil pemeriksaan melalui jaringan nirkabel.\\n\\n**Metode pengembangan**\\n1. Merancang modul optik dan pencahayaan.\\n2. Mengembangkan sistem pengambilan citra retina.\\n3. Melakukan preprocessing citra.\\n4. Mengembangkan CNN untuk skrining citra.\\n5. Menguji kualitas citra, sensitivitas, spesifisitas, dan waktu pemrosesan.\\n\\n**Luaran**\\n- Prototype retinal image acquisition.\\n- Model AI untuk skrining.\\n- Aplikasi penyimpanan hasil pemeriksaan.\\n\\nCatatan: perlu tenaga ahli mata untuk validasi citra dan pengujian. Jangan mengklaim diagnosis otomatis tanpa validasi klinis.\\n\\n---\\n\\n### 7. CARDIO-VOICE\\n**Sistem Skrining Risiko Gangguan Jantung Berbasis Analisis Fonokardiogram Digital dan Edge AI dengan Komunikasi Nirkabel**\\n\\n\u003cAsyncImage query=\\\"digital electronic stethoscope phonocardiogram heart sound sensor prototype\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Latar belakang**\\n\\nBunyi jantung mengandung informasi akustik mengenai aktivitas mekanis jantung. Perubahan karakteristik bunyi jantung dapat berkaitan dengan kondisi abnormal, sehingga analisis fonokardiogram (PCG) berpotensi membantu skrining awal.\\n\\n**Kebaruan**\\n- Mengembangkan stetoskop digital berbasis sensor akustik kontak.\\n- Menggabungkan analisis PCG dan fitur denyut jantung.\\n- Menerapkan noise cancellation untuk mengurangi gangguan suara lingkungan.\\n- Menggunakan Edge AI untuk klasifikasi pola bunyi jantung.\\n\\n**Metode pengembangan**\\n1. Mengembangkan rangkaian sensor akustik.\\n2. Mengimplementasikan filter digital untuk menghilangkan noise.\\n3. Melakukan segmentasi siklus bunyi jantung.\\n4. Mengekstraksi fitur MFCC dan spektral.\\n5. Mengembangkan model klasifikasi.\\n6. Menguji performa dengan dataset PCG tervalidasi.\\n\\n**Luaran**\\n- Prototype stetoskop digital.\\n- Sistem analisis PCG.\\n- Model Edge AI.\\n- Aplikasi monitoring hasil skrining.\\n\\n---\\n\\n### 8. STROKE-MON\\n**Wearable Neuro-Motor Sensor Berbasis IMU dan Surface EMG dengan Edge AI untuk Deteksi Dini Asimetri Gerak sebagai Indikator Risiko Stroke**\\n\\n\u003cAsyncImage query=\\\"wearable surface EMG sensor armband IMU rehabilitation electronics prototype\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Latar belakang**\\n\\nAsimetri gerak dan perubahan aktivitas otot dapat ditemukan pada individu dengan gangguan neuromotor. Pemantauan gerakan tubuh secara objektif dapat membantu mengidentifikasi perubahan fungsi motorik.\\n\\n**Kebaruan**\\n- Menggabungkan sensor IMU dan surface EMG.\\n- Mengukur perbedaan aktivitas otot dan pola gerak kanan-kiri.\\n- Mengembangkan algoritma pengenalan asimetri gerak.\\n- Menggunakan komunikasi nirkabel untuk mengirimkan hasil pengukuran.\\n\\n**Metode pengembangan**\\n1. Merancang wearable sensor IMU dan EMG.\\n2. Mengembangkan akuisisi sinyal secara simultan.\\n3. Melakukan filtering dan normalisasi sinyal.\\n4. Mengekstraksi fitur aktivitas otot dan gerakan.\\n5. Mengembangkan algoritma klasifikasi asimetri.\\n6. Menguji prototype dengan protokol gerakan terstandar.\\n\\n**Luaran**\\n- Prototype wearable neuro-motor.\\n- Algoritma analisis asimetri gerak.\\n- Aplikasi monitoring.\\n\\nCatatan: alat ini lebih tepat disebut sistem pemantauan asimetri motorik, bukan alat diagnosis atau prediksi stroke.\\n\\n---\\n\\n### 9. OXYSENSE\\n**Portable Multi-Wavelength PPG dan Respiratory Sensor dengan Adaptive Signal Processing untuk Skrining Dini Risiko Hipoksemia**\\n\\n\u003cAsyncImage query=\\\"portable pulse oximeter respiratory monitoring medical wearable sensor device\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Latar belakang**\\n\\nHipoksemia merupakan kondisi rendahnya kadar oksigen dalam darah yang dapat berkaitan dengan berbagai gangguan kesehatan. Pemantauan saturasi oksigen dan pola pernapasan dapat membantu mengenali perubahan kondisi fisiologis lebih awal.\\n\\n**Kebaruan**\\n- Menggabungkan multi-wavelength PPG dengan sensor respirasi.\\n- Menerapkan adaptive filtering untuk mengurangi artefak gerakan.\\n- Mengembangkan algoritma pendeteksian kualitas sinyal sebelum menghitung parameter.\\n- Mengirimkan informasi hasil pengukuran melalui Bluetooth atau Wi-Fi.\\n\\n**Metode pengembangan**\\n1. Merancang sensor PPG multi-wavelength.\\n2. Mengintegrasikan sensor respirasi.\\n3. Mengembangkan algoritma adaptive filtering.\\n4. Menghitung SpO2 dan parameter respirasi.\\n5. Menguji hasil pengukuran terhadap alat referensi yang tervalidasi.\\n6. Mengukur akurasi, latency, dan konsumsi daya.\\n\\n**Luaran**\\n- Prototype portable oxygen monitoring.\\n- Algoritma adaptive signal processing.\\n- Dashboard monitoring dan notifikasi.\\n\\n---\\n\\n### 10. ORAL-SCAN\\n**Portable Oral Lesion Screening Berbasis Multispectral LED Imaging dan Edge AI untuk Identifikasi Awal Kelainan Mukosa Mulut**\\n\\n\u003cAsyncImage query=\\\"portable oral examination camera multispectral LED imaging medical device prototype\\\" aspectRatio=\\\"16:9\\\" width=\\\"100%\\\"/\u003e\\n\\n**Latar belakang**\\n\\nKelainan mukosa mulut dapat berkembang menjadi kondisi yang lebih serius apabila tidak teridentifikasi dan diperiksa lebih lanjut. Pemeriksaan visual awal dapat dibantu dengan teknologi pencitraan portabel.\\n\\n**Kebaruan**\\n- Mengintegrasikan kamera makro dan pencahayaan LED multispektral.\\n- Mengambil citra dengan beberapa kondisi pencahayaan.\\n- Menggunakan analisis tekstur dan warna untuk mengidentifikasi pola kelainan.\\n- Mengimplementasikan Edge AI untuk analisis citra secara langsung.\\n\\n**Metode pengembangan**\\n1. Merancang perangkat kamera makro.\\n2. Mengintegrasikan beberapa kanal LED.\\n3. Mengembangkan sistem akuisisi citra terstandar.\\n4. Melakukan preprocessing dan ekstraksi fitur.\\n5. Mengembangkan CNN untuk klasifikasi citra.\\n6. Melakukan validasi dengan dataset dan penilaian tenaga medis.\\n\\n**Luaran**\\n- Prototype portable oral scanner.\\n- Model AI untuk skrining citra.\\n- Aplikasi visualisasi hasil pemeriksaan.\\n\\nCatatan: sistem tidak menggantikan pemeriksaan dokter gigi atau biopsi untuk penegakan diagnosis.\\n\\n---\\n\\n\",{\"_1035\":1036},{\"_152\":2129,\"_159\":2240,\"_54\":2241,\"_56\":2241,\"_163\":2242,\"_165\":166,\"_168\":169,\"_170\":2243,\"_172\":173},[2076],{\"_860\":2253,\"_2254\":2255,\"_170\":2256},1795413933.435599,{\"_855\":856,\"_857\":2251},{\"_193\":194,\"_200\":918,\"_202\":918,\"_205\":2244,\"_2245\":2246,\"_2247\":2248,\"_2249\":2174,\"_2087\":2112,\"_2090\":2091,\"_208\":10,\"_2250\":34},\"81fb1df7-08d0-48a6-a598-ff17ff08464a\",\"reasoning_title_content_transition\",\"numeric\",\"reasoning_titles\",[2174],\"reasoning_title\",\"is_redacted\",[2252],\"The output of this plugin was redacted.\",\"tool\",\"name\",\"web.run\",{\"_1035\":2257},\"tool:web.run\",{\"_152\":2128,\"_159\":2260,\"_54\":2261,\"_56\":2261,\"_163\":2262,\"_165\":166,\"_168\":169,\"_170\":2263,\"_172\":173},[2129],{\"_860\":2253,\"_2254\":2255,\"_170\":2269},1795413932.919957,{\"_855\":856,\"_857\":2268},{\"_2247\":2264,\"_2249\":2265,\"_2087\":2112,\"_2090\":2091,\"_193\":194,\"_200\":918,\"_202\":918,\"_205\":2127,\"_208\":10,\"_2250\":34},[2265 nInspirasi dari karya-karya berprestasi PIMNAS 2025 dapat diterapkan melalui tiga pendekatan:\\n1. Mengembangkan alat kesehatan yang menjawab permasalahan nyata.\\n2. Mengintegrasikan beberapa teknologi menjadi satu sistem yang memiliki fungsi baru.\\n3. Membuktikan manfaat inovasi melalui pengujian prototype, bukan hanya simulasi atau desain konseptual.\\n\\nSepuluh alternatif berikut dirancang agar tetap berakar pada kompetensi Sistem Telekomunikasi, khususnya elektronika, sensor, komunikasi nirkabel, pengolahan sinyal, dan AI.\\n\\n\",{},{\"_152\":2290,\"_159\":2305,\"_54\":2306,\"_56\":2306,\"_163\":2307,\"_165\":166,\"_168\":169,\"_170\":2308,\"_172\":861},\"4ddfb05e-1983-4002-b73c-f3e32cf9af5c\",[2075],{\"_860\":873,\"_170\":2313},1795413930.401596,{\"_855\":856,\"_857\":2312},{\"_870\":34,\"_179\":2309,\"_181\":2310,\"_911\":2311,\"_190\":109,\"_193\":194,\"_196\":917,\"_198\":199,\"_200\":918,\"_202\":918,\"_203\":109,\"_66\":67,\"_205\":2303,\"_206\":919,\"_208\":10,\"_204\":14},[],[],[],[848],{},{\"_152\":2303,\"_159\":2317,\"_54\":2318,\"_56\":2318,\"_163\":2319,\"_165\":166,\"_168\":169,\"_170\":2320,\"_172\":173},\"bbb211b2-c743-4d54-86a2-1adc52d498a6\",[2290],{\"_860\":873,\"_170\":2323},1795413930.395562,{\"_855\":856,\"_857\":2322},{\"_870\":34,\"_206\":2321,\"_190\":109,\"_193\":194,\"_196\":917,\"_198\":199,\"_200\":918,\"_202\":918,\"_203\":109,\"_66\":67,\"_205\":2315,\"_208\":10,\"_204\":14},\"6edc603d-4d87-5bf5-bc2f-cf90fa308ba5\",[848],{},{\"_152\":2315,\"_159\":2327,\"_54\":2328,\"_56\":2329,\"_163\":2330,\"_165\":166,\"_168\":169,\"_170\":2331,\"_172\":173},\"bfb4a826-7972-44eb-b65b-727ab9519894\",[2303],{\"_860\":899,\"_170\":2339},1795413929.893353,1795413962.120177,{\"_855\":856,\"_857\":2337},{\"_203\":67,\"_66\":67,\"_870\":14,\"_191\":2332,\"_884\":2333,\"_886\":2334,\"_888\":14,\"_889\":2335,\"_891\":14,\"_892\":14,\"_893\":14,\"_894\":2336,\"_206\":2321,\"_196\":917,\"_896\":-5,\"_200\":918,\"_202\":918,\"_208\":10,\"_204\":14},[],[]  15.00 WIB  Image: PIMNAS 38 Resmi Ditutup: Unh...\",{\"_955\":849,\"_957\":958,\"_959\":849},{\"_812\":1020,\"_1021\":-5,\"_814\":2420,\"_816\":2421,\"_62\":2422,\"_1025\":2423,\"_47\":848,\"_818\":-5,\"_50\":1027,\"_1028\":2424,\"_1030\":14},11124,11125,[],[],[],[854],[2427],\"### 2. Alternatif judul PKM bidang kesehatan dan telekomunikasi\\n\\nSaya susun menjadi beberapa kelompok agar bisa dipilih sesuai kemampuan mahasiswa Sistem Telekomunikasi.\\n\\n#### A. Tema deteksi dini dan monitoring kesehatan\\n\\n\u003cbadge color=\\\"success\\\"\u003ePrioritas tinggi\u003c/badge\u003e \\n\\n\u003cbox gap={3}\u003e\\n  \u003cbox gap={1}\u003e\\n    **1. CARDIOSENSE: Wearable IoT-Based ECG Monitoring dengan Edge AI untuk Deteksi Dini Risiko Aritmia Jantung secara Real-Time**\\n\\n    - Teknologi: Sensor ECG, ESP32, Bluetooth/Wi-Fi, Edge AI.\\n    - Kebaruan: Analisis sinyal jantung langsung pada perangkat.\\n    - Luaran: Prototype wearable dan aplikasi monitoring.\\n  \u003c/box\u003e\\n  \u003cdivider color=\\\"subtle\\\"/\u003e\\n  \u003cbox gap={1}\u003e\\n    **2. RESPIRALERT: Sistem Monitoring Respirasi Berbasis Wireless Sensor Network untuk Deteksi Dini Gangguan Pernapasan**\\n\\n    - Teknologi: Sensor pernapasan, LoRa, IoT.\\n    - Kebaruan: Pemantauan pola respirasi secara kontinu dan jarak jauh.\\n    - Luaran: Alat monitoring dan dashboard kesehatan.\\n  \u003c/box\u003e\\n  \u003cdivider color=\\\"subtle\\\"/\u003e\\n  \u003cbox gap={1}\u003e\\n    **3. GLUCOCONNECT: Sistem Prediksi Risiko Hipoglikemia Berbasis Wearable Sensor dan Machine Learning dengan Transmisi Data Real-Time**\\n\\n    - Teknologi: Wearable sensor, IoT, machine learning.\\n    - Kebaruan: Sistem peringatan dini berdasarkan perubahan parameter fisiologis.\\n    - Luaran: Prototype dan aplikasi peringatan dini.\\n  \u003c/box\u003e\\n  \u003cdivider color=\\\"subtle\\\"/\u003e\\n  \u003cbox gap={1}\u003e\\n    **4. NEUROTRACK: Sistem Deteksi Dini Risiko Gangguan Neurologis melalui Analisis Sinyal Biometrik Berbasis AI dan Komunikasi Nirkabel**\\n\\n    - Teknologi: Sensor biometrik, AI, wireless communication.\\n    - Kebaruan: Integrasi analisis pola biometrik dengan pemantauan jarak jauh.\\n    - Luaran: Sistem analisis dan monitoring kesehatan neurologis.\\n  \u003c/box\u003e\\n\u003c/box\u003e\\n\\n#### B. Tema telemedicine dan akses layanan kesehatan\\n\\n\u003cbox gap={3}\u003e\\n  \u003cbox gap={1}\u003e\\n    **5. MEDILINK: Sistem Telemedicine Berbasis LoRa dan Internet of Things untuk Pemantauan Pasien di Wilayah dengan Keterbatasan Jaringan Internet**\\n\\n    - Teknologi: LoRa, gateway, IoT.\\n    - Kebaruan: Komunikasi data kesehatan pada wilayah minim infrastruktur internet.\\n    - Luaran: Prototype komunikasi dan monitoring pasien.\\n  \u003c/box\u003e\\n  \u003cdivider color=\\\"subtle\\\"/\u003e\\n  \u003cbox gap={1}\u003e\\n    **6. SMART-CARE: Sistem Monitoring Pasien Lansia Berbasis Wireless Body Area Network dengan Deteksi Kondisi Darurat Otomatis**\\n\\n    - Teknologi: WBAN, sensor gerak, sensor detak jantung, BLE.\\n    - Kebaruan: Pemantauan aktivitas dan kondisi fisiologis lansia.\\n    - Luaran: Perangkat wearable dan sistem notifikasi keluarga.\\n  \u003c/box\u003e\\n  \u003cdivider color=\\\"subtle\\\"/\u003e\\n  \u003cbox gap={1}\u003e\\n    **7. RURAL HEALTH CONNECT: Sistem Komunikasi Data Medis Berbasis Delay Tolerant Network untuk Pelayanan Kesehatan Daerah Terpencil**\\n\\n    - Teknologi: DTN, jaringan nirkabel, penyimpanan data lokal.\\n    - Kebaruan: Pengiriman data medis ketika koneksi internet tidak stabil.\\n    - Luaran: Prototype sistem komunikasi data medis.\\n  \u003c/box\u003e\\n\u003c/box\u003e\\n\\n#### C. Tema rehabilitasi dan alat bantu kesehatan\\n\\n\u003cbadge color=\\\"success\\\"\u003ePotensi PKM-KC\u003c/badge\u003e\\n\\n\u003cbox gap={3}\u003e\\n  \u003cbox gap={1}\u003e\\n    **8. REHAB-MOTION: Smart Rehabilitation Glove Berbasis Sensor Flex dan Wireless Communication untuk Monitoring Pemulihan Motorik Pasien Pasca-Stroke**\\n\\n    - Teknologi: Flex sensor, ESP32, Bluetooth, aplikasi.\\n    - Kebaruan: Pemantauan gerakan jari dan evaluasi perkembangan rehabilitasi.\\n    - Luaran: Sarung tangan rehabilitasi pintar.\\n  \u003c/box\u003e\\n  \u003cdivider color=\\\"subtle\\\"/\u003e\\n  \u003cbox gap={1}\u003e\\n    **9. POSTUREGUARD: Wearable Smart Sensor Berbasis IoT untuk Deteksi dan Koreksi Postur Tubuh guna Mencegah Gangguan Muskuloskeletal**\\n\\n    - Teknologi: IMU sensor, BLE, algoritma klasifikasi.\\n    - Kebaruan: Deteksi postur tubuh dan pemberian peringatan secara langsung.\\n    - Luaran: Perangkat wearable dan aplikasi.\\n  \u003c/box\u003e\\n  \u003cdivider color=\\\"subtle\\\"/\u003e\\n  \u003cbox gap={1}\u003e\\n    **10. SMART-STEP: Sepatu Pintar Berbasis Sensor Tekanan dan Wireless Sensor Network untuk Analisis Pola Berjalan Pasien Rehabilitasi**\\n\\n    - Teknologi: Pressure sensor, IMU, Bluetooth.\\n    - Kebaruan: Analisis distribusi tekanan dan pola berjalan.\\n    - Luaran: Smart footwear dan dashboard analisis.\\n  \u003c/box\u003e\\n\u003c/box\u003e\\n\\n#### D. Tema AI, pemrosesan sinyal, dan kesehatan\\n\\n\u003cbox gap={3}\u003e\\n  \u003cbox gap={1}\u003e\\n    **11. VOICE-HEALTH: Sistem Skrining Awal Gangguan Pernapasan melalui Analisis Sinyal Suara Berbasis Deep Learning dan Mobile Communication**\\n\\n    - Teknologi: Digital Signal Processing, Deep Learning, aplikasi mobile.\\n    - Kebaruan: Identifikasi pola suara yang berpotensi mengindikasikan gangguan pernapasan.\\n    - Luaran: Aplikasi skrining awal berbasis suara.\\n  \u003c/box\u003e\\n  \u003cdivider color=\\\"subtle\\\"/\u003e\\n  \u003cbox gap={1}\u003e\\n    **12. SLEEPWISE: Sistem Deteksi Gangguan Tidur Berbasis Analisis Sinyal Biometrik dan AI dengan Monitoring Nirkabel**\\n\\n    - Teknologi: Sensor SpO2, heart rate, accelerometer, AI.\\n    - Kebaruan: Analisis beberapa parameter fisiologis untuk skrining gangguan tidur.\\n    - Luaran: Wearable monitoring dan aplikasi.\\n  \u003c/box\u003e\\n  \u003cdivider color=\\\"subtle\\\"/\u003e\\n  \u003cbox gap={1}\u003e\\n    **13. MENTAL-SENSE: Sistem Skrining Risiko Stres Berbasis Analisis Sinyal Fisiologis dan Facial Emotion Recognition dengan Edge AI**\\n\\n    - Teknologi: PPG, GSR, kamera, Edge AI.\\n    - Kebaruan: Fusi data fisiologis dan ekspresi wajah untuk skrining risiko stres.\\n    - Luaran: Prototype sistem skrining kesehatan mental.\\n  \u003c/box\u003e\\n  \u003cdivider color=\\\"subtle\\\"/\u003e\\n  \u003cbox gap={1}\u003e\\n    **14. NEURO-COMM: Sistem Monitoring Aktivitas Elektrofisiologis Berbasis Wireless EEG dan Machine Learning untuk Skrining Gangguan Neurologis**\\n\\n    - Teknologi: EEG, wireless transmission, machine learning.\\n    - Kebaruan: Pengolahan sinyal EEG dan transmisi data untuk analisis jarak jauh.\\n    - Luaran: Prototype akuisisi dan analisis sinyal EEG.\\n  \u003c/box\u003e\\n\u003c/box\u003e\\n\\n---\\n\\n### 3. Rekomendasi berdasarkan potensi kompetisi PKM\\n\\nJika targetnya adalah menghasilkan karya yang berpeluang dikembangkan menjadi finalis PIMNAS, saya akan memprioritaskan judul berikut.\\n\\n| Prioritas | Judul | Keunggulan |\\n|---|---|---|\\n| 1 | CARDIOSENSE | Masalah kesehatan serius, prototype terukur |\\n| 2 | REHAB-MOTION | Produk konkret dan manfaat langsung |\\n| 3 | MEDILINK | Mengangkat persoalan pemerataan layanan kesehatan |\\n| 4 | SMART-STEP | Kombinasi sensor, DSP, dan AI |\\n| 5 | MENTAL-SENSE | Integrasi AI dan telekomunikasi |\\n\\n### 4. Pemetaan dengan kompetensi Sistem Telekomunikasi\\n\\nAgar topik tidak terlalu bergeser ke bidang kedokteran, sebaiknya unsur telekomunikasi menjadi bagian inti inovasi.\\n\\n| Kompetensi | Implementasi dalam PKM |\\n|---|---|\\n| Telekomunikasi nirkabel | BLE, Wi-Fi, LoRa, NB-IoT |\\n| Pengolahan sinyal digital | ECG, EEG, PPG, filtering, feature extraction |\\n| Internet of Things | Wireless sensor network, cloud, dashboard |\\n| Kecerdasan buatan | Edge AI, deep learning, klasifikasi |\\n| Elektronika telekomunikasi | Sensor, mikrokontroler, akuisisi data |\\n| Jaringan komunikasi | Keandalan transmisi, latency, packet loss |\\n\\n### 5. Saran strategi memilih judul\\n\\nAda tiga hal yang menurut saya penting:\\n\\n1. **Jangan hanya membuat aplikasi monitoring.** Usahakan ada perangkat keras atau metode pengolahan sinyal yang menjadi keunggulan utama.\\n2. **Pilih masalah kesehatan yang spesifik.** Misalnya deteksi aritmia, rehabilitasi pasca-stroke, gangguan pernapasan, atau monitoring lansia.\\n3. **Pastikan prototype dapat diuji.** Ada parameter keberhasilan seperti akurasi klasifikasi, latency transmisi, packet loss, sensitivitas sensor, dan konsumsi daya.\\n\\nUntuk pengembangan alat kesehatan, klaim deteksi penyakit harus divalidasi dengan tenaga medis dan data yang sesuai. Jika belum ada validasi klinis, gunakan istilah *skrining awal* atau *monitoring*, bukan diagnosis.\\n\\n---\\n\\n### 6. Saya ingin merekomendasikan satu arah yang lebih strategis\\n\\nMenurut saya, untuk mahasiswa Sistem Telekomunikasi, tema **Wearable Health Monitoring berbasis IoT dan Edge AI** sangat menarik karena dapat menggabungkan beberapa kompetensi keilmuan sekaligus.\\n\\nNamun, saya ingin menyesuaikan alternatif berikutnya dengan karakter tim mahasiswa agar judulnya tidak hanya menarik, tetapi juga realistis untuk dikerjakan dan berpotensi kompetitif.\\n\\n{@body const [scheme,setScheme] = DIL.useState(\\\"PKM-KC\\\")}\\n{@body const [team,setTeam] = DIL.useState(\\\"Telekomunikasi\\\")}\\n{@body const [focus,setFocus] = DIL.useState(\\\"Deteksi dini penyakit\\\")}\\n{@body const [level,setLevel] = DIL.useState(\\\"Prototype alat\\\")}\\n\u003cbox border radius=\\\"lg\\\" padding={3} gap={3}\u003e\\n  **Penajaman arah proposal PKM**\\n  \u003cform gap={3} onSubmit={()=\u003eGenUI.issueNewTurn(\\\"Buatkan 10 alternatif judul PKM yang lebih kompetitif beserta kebaruan, latar belakang, metode, dan luaran. Skema: \\\"+scheme+\\\". Kompetensi tim: \\\"+team+\\\". Fokus kesehatan: \\\"+focus+\\\". Target luaran: \\\"+level+\\\". Gunakan inspirasi pemenang PIMNAS 2025 tanpa meniru judulnya.\\\")}\u003e\\n    \u003ctext weight=\\\"medium\\\" size=\\\"sm\\\"\u003e1. Skema PKM yang ditargetkan\u003c/text\u003e\\n    \u003cradio-group direction=\\\"col\\\" value={scheme} onChange={setScheme}\u003e\\n      \u003cradio value=\\\"PKM-KC\\\"\u003ePKM-KC (Karsa Cipta)\u003c/radio\u003e\\n      \u003cradio value=\\\"PKM-RE\\\"\u003ePKM-RE (Riset Eksakta)\u003c/radio\u003e\\n      \u003cradio value=\\\"PKM-RSH\\\"\u003ePKM-RSH (Riset Sosial Humaniora)\u003c/radio\u003e\\n      \u003cradio value=\\\"Belum ditentukan\\\"\u003eBelum ditentukan\u003c/radio\u003e\\n    \u003c/radio-group\u003e\\n    \u003cdivider color=\\\"subtle\\\"/\u003e\\n    \u003ctext weight=\\\"medium\\\" size=\\\"sm\\\"\u003e2. Komposisi keahlian tim\u003c/text\u003e\\n    \u003cradio-group direction=\\\"col\\\" value={team} onChange={setTeam}\u003e\\n      \u003cradio value=\\\"Telekomunikasi\\\"\u003eMayoritas mahasiswa Telekomunikasi\u003c/radio\u003e\\n      \u003cradio value=\\\"Telekomunikasi dan Informatika\\\"\u003eTelekomunikasi dan Informatika\u003c/radio\u003e\\n      \u003cradio value=\\\"Lintas disiplin dengan Kedokteran atau Keperawatan\\\"\u003eKolaborasi dengan Kedokteran/Keperawatan\u003c/radio\u003e\\n      \u003cradio value=\\\"Campuran berbagai bidang\\\"\u003eCampuran berbagai bidang\u003c/radio\u003e\\n    \u003c/radio-group\u003e\\n    \u003cdivider color=\\\"subtle\\\"/\u003e\\n    \u003ctext weight=\\\"medium\\\" size=\\\"sm\\\"\u003e3. Fokus kesehatan\u003c/text\u003e\\n    \u003cradio-group direction=\\\"col\\\" value={focus} onChange={setFocus}\u003e\\n      \u003cradio value=\\\"Deteksi dini penyakit\\\"\u003eDeteksi dini penyakit\u003c/radio\u003e\\n      \u003cradio value=\\\"Kesehatan jantung dan pernapasan\\\"\u003eJantung dan pernapasan\u003c/radio\u003e\\n      \u003cradio value=\\\"Rehabilitasi pasien\\\"\u003eRehabilitasi pasien\u003c/radio\u003e\\n      \u003cradio value=\\\"Kesehatan mental\\\"\u003eKesehatan mental\u003c/radio\u003e\\n      \u003cradio value=\\\"Kesehatan lansia\\\"\u003eKesehatan lansia\u003c/radio\u003e\\n    \u003c/radio-group\u003e\\n    \u003cdivider color=\\\"subtle\\\"/\u003e\\n    \u003ctext weight=\\\"medium\\\" size=\\\"sm\\\"\u003e4. Target luaran\u003c/text\u003e\\n    \u003cradio-group direction=\\\"col\\\" value={level} onChange={setLevel}\u003e\\n      \u003cradio value=\\\"Prototype alat\\\"\u003ePrototype alat kesehatan\u003c/radio\u003e\\n      \u003cradio value=\\\"Aplikasi dan sistem IoT\\\"\u003eAplikasi dan sistem IoT\u003c/radio\u003e\\n      \u003cradio value=\\\"Hardware dan AI terintegrasi\\\"\u003eHardware dan AI terintegrasi\u003c/radio\u003e\\n      \u003cradio value=\\\"Penelitian dan publikasi ilmiah\\\"\u003ePenelitian dan publikasi ilmiah\u003c/radio\u003e\\n    \u003c/radio-group\u003e\\n    \u003cbutton submit block\u003eSusun rekomendasi judul PKM\u003c/button\u003e\\n  \u003c/form\u003e\\n\u003c/box\u003e\\n\\nSaya bisa lanjutkan sampai menghasilkan judul yang dilengkapi **kebaruan (novelty), gap penelitian, rancangan teknologi, metode pengujian, dan potensi keunggulan untuk bersaing di PIMNAS**.\",{\"_1035\":1036},{\"_152\":2341,\"_159\":2432,\"_54\":2433,\"_56\":2434,\"_163\":2435,\"_165\":166,\"_167\":34,\"_168\":169,\"_170\":2436,\"_172\":173,\"_174\":175},\"6f76cd26-5605-400a-8db9-3aab2a3a5186\",[2325],{\"_860\":861,\"_170\":2738},1795413669.374634,1795413685.020117,{\"_855\":856,\"_857\":2736},{\"_1045\":34,\"_1046\":2437,\"_1048\":2325,\"_183\":2438,\"_185\":2439,\"_62\":2440,\"_176\":2441,\"_178\":34,\"_179\":2442,\"_181\":2443,\"_187\":2444,\"_190\":109,\"_191\":2445,\"_193\":194,\"_195\":34,\"_196\":2352,\"_198\":199,\"_200\":2353,\"_202\":2353,\"_203\":109,\"_66\":67,\"_204\":34,\"_205\":2430,\"_206\":2354,\"_1057\":2446,\"_208\":10},[2735,2325],{\"_338\":2532,\"_340\":2533,\"_342\":2534,\"_344\":169
